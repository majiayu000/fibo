[package]
name = "mooring-platform"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

# The only crate that may depend on an operating system's API (docs/platform/index.html).
# tests/boundary.rs keeps these dependencies from appearing anywhere else.
[dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
regex = "1"
