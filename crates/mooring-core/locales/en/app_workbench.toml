# English UI strings for workbench forms, machines, peek, sessions, and to-dos.

# Forms & to-do editor
"为什么稍后再看（必填）" = "Why snooze it (required)"
"多少小时后再看（必填）" = "Snooze for how many hours (required)"
"说明（可选 · 原样交给 Agent）" = "Notes (optional · passed to the agent as written)"
"验收标准" = "Acceptance checks"
"写一条完成时怎么核对…" = "Write how to check when it's done…"
"请写明为什么稍后再看，并填 1–8760 小时后再看" = "Give a reason to snooze and enter 1–8760 hours"
"编辑待办" = "Edit to-do"
"新建待办" = "New to-do"
"保存后出现在左栏「待办」和鸟瞰顶部" = "Appears under “To-do” in the sidebar and at the top of Board once saved"
"先写要做什么" = "Write what to do first"
"默认用哪个 Agent" = "Default agent"
"开始时还能改" = "You can still change it when starting"
"找不到 {cmd} 命令：开始后会停在「找不到命令」。先安装或加进 PATH，或换一个 Agent" = "Command {cmd} not found: starting will stop at “command not found”. Install it or add it to PATH first, or pick another agent"
"保存为待办" = "Save to-do"
"保存并开始" = "Save and start"
"都能再编辑；验收标准改字不会丢掉已挂的证据" = "Everything can be edited later; rewording checks keeps attached evidence"
"在哪个空间做" = "Which space"
"开始时在这个目录开终端" = "Opens a terminal in this folder when starting"
"这个空间的目录不在了：可以先保存为待办，改好目录再开始" = "This space's folder is gone: save the to-do first, then fix the folder before starting"
"改空间目录" = "Change folder"

# Criteria checklist
"和第 {n} 条相同，保存时合并" = "Same as #{n}; merged on save"
"回车加下一条" = "Enter for next line"
"删除第 {n} 条" = "Delete check #{n}"
"再加一条…" = "Add another…"
"可选 · 也会交给 Agent，完成时逐条核对" = "Optional · also handed to the agent and checked one by one when done"
"{written} 条" = "{written} {written|check|checks}"
"没有验收标准，完成时没有东西可核对；开始后待办信息条会一直提示「补写」" = "Without acceptance checks, there is nothing to verify when done; the to-do bar will keep prompting “Add checks”"
"每条最好能被一条命令、一次测试或一处文件改动证明；Fibo 会从关联会话里找这类记录当证据。" = "Each check works best when a command, test or file change can prove it; Fibo looks for those records in linked sessions as evidence."

# Form preview
"（先写要做什么）" = "(write what to do first)"
"保存并开始之后" = "After Save and start"
"在「{space}」新开一个画面，标签就叫待办标题" = "Open a new pane in “{space}”, with the tab named after the to-do"
"运行" = "Run"
"，等它的输入框出现" = "and wait for its input prompt"
"把下面这段放进 {agent} 的输入框，" = "Put the text below into {agent}'s input, "
"不发送" = "without sending"
"你检查、可以改，按回车才发给 Agent" = "Review or edit it, then press Enter to send to the agent"
"放进输入框的内容" = "Placed in the input"
"不是 shell 参数，引号和换行原样保留" = "Not shell arguments; quotes and line breaks stay as written"
"同一待办再点「开始」会切回这个画面" = "Clicking “Start” again on the same to-do switches back to this pane"

