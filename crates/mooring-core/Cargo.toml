[package]
name = "mooring-core"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
uuid = { version = "1", features = ["v4"] }
serde.workspace = true
serde_json.workspace = true
regex = "1"
libc.workspace = true
sha2 = "0.10"
rustc-hash = "2"
ed25519-dalek = "2"
getrandom = "0.3"
libghostty-vt.workspace = true
similar = { version = "3.2.1", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
# Job objects and process lookup, which std has no call for. Already in Cargo.lock through
# other crates, at this version.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
