# Command usage table (`control.rs`, `themes_cmd.rs`, `plugins_run.rs`)
"fibo list [--json]                         终端列表：要你处理的排前面，状态、Agent、标签、目录、编号" = "fibo list [--json]                         List terminals (attention needed first: status, agent, tab, cwd, ID)"
"fibo read <终端> [--lines N]               画面最后 N 行（默认 50）" = "fibo read <terminal> [--lines N]           Read the last N visible screen lines (default 50)"
"fibo send <终端> <文字|-> [--enter]        把文字作为粘贴放进终端；- 从标准输入读（最多 64 KiB）" = "fibo send <terminal> <text|-> [--enter]    Paste text into a terminal; - reads stdin (up to 64 KiB)"
"fibo prompt <终端> <文字|-> [--wait] [--timeout 秒] [--force]\n                                             给 Agent 发一条并回车；--force 可回答普通问题，不能代替审批" = "fibo prompt <terminal> <text|-> [--wait] [--timeout SECS] [--force]\n                                             Send a prompt and submit; --force answers ordinary questions, never approvals"
"fibo wait <终端> [--until idle|waiting|working] [--timeout 秒]\n                                             等 Agent 进入某个状态（默认 idle：这一轮做完）" = "fibo wait <terminal> [--until idle|waiting|working] [--timeout SECS]\n                                             Wait for an Agent to enter a phase (default idle: turn finished)"
"fibo explain --file <画面.txt> --agent <claude|codex> [--json]\nfibo explain <终端> [--json]               画面规则怎么读这块屏：状态、命中的规则、规则版本和来源、看到的行；\n                                             还有每个后台 shell 算任务还是服务、依据哪条" = "fibo explain --file <screen.txt> --agent <claude|codex> [--json]\nfibo explain <terminal> [--json]           Explain how screen rules classify this pane (state, matched rule, rule source, visible lines,\n                                             and whether each background shell counts as a job or service)"
"fibo events [--json]                       先列出现在的状态，再每有变化输出一行，直到 Ctrl-C：\n                                             started / waiting / error / done、approval / approval_gone、\n                                             terminal_started / terminal_exited、command_done / command_failed；\n                                             lagged 表示跟不上丢了事件，应重新开一次取现状" = "fibo events [--json]                       Emit current snapshot then stream one line per state change until Ctrl-C:\n                                             started / waiting / error / done, approval / approval_gone,\n                                             terminal_started / terminal_exited, command_done / command_failed;\n                                             lagged means events were dropped and a fresh snapshot should be taken"
"fibo split <终端> [--down] [--size 0.5] [--tab|--here] [--cwd 目录] [--json] [-- 命令…]\n                                             在这个终端右边（--down 下面）开一块新分屏，打印新终端编号；\n                                             标签已有 4 块或切开太窄时开到「旁屏」标签（--here 改为拒绝，\n                                             --tab 直接开到旁屏）；给了命令就在新 shell 里跑，跑完留在 shell" = "fibo split <terminal> [--down] [--size 0.5] [--tab|--here] [--cwd DIR] [--json] [-- <cmd>...]\n                                             Open a split to the right (--down below) and print the new terminal ID;\n                                             overflows to a side tab past 4 panes or narrow width (--here refuses instead,\n                                             --tab always opens a side tab); optional command runs in the new shell and stays open"
"fibo run <agent> <任务|-> [--split] [--cwd 目录] [--no-report] [--from <终端>] [--timeout 秒] [--json]\n                                             派一个 Agent 去做事：开在旁屏标签（--split 开在旁边），等它出现输入框\n                                             再交任务；它每结束一轮，结果自动发回你的输入框（<fibo from=…>）；\n                                             不在 Fibo 终端里时用 --from 说开在谁旁边、汇报给谁" = "fibo run <agent> <task|-> [--split] [--cwd DIR] [--no-report] [--from <terminal>] [--timeout SECS] [--json]\n                                             Delegate a task to an Agent in a side tab (--split opens beside you), wait for its input box,\n                                             and submit; when each turn ends, results report back (<fibo from=...>);\n                                             outside a Fibo terminal, pass --from to pick the anchor and recipient"
"fibo close <终端>                          关掉这块分屏并结束里面的程序" = "fibo close <terminal>                      Close a pane and terminate its running process"
"fibo todo list [--all] [--json]            没做完的待办；--all 连已收尾的\nfibo todo show [--task <待办>] [--json]      看一条：用户写的、验收标准、进展\nfibo todo add <标题|-> [--said <原话>] [--space <空间>] [--work] [--json]\n                                           记一件事，默认只记下来自哪个会话；--work 表示这个会话就在做它\nfibo todo note <文字|-> [--task <待办>]      写进展：做了什么、剩什么、要用户定什么；完成由用户标记" = "fibo todo list [--all] [--json]            List open todos; --all includes completed ones\nfibo todo show [--task <todo>] [--json]      Show a todo: user prompt, acceptance criteria, and progress notes\nfibo todo add <title|-> [--said <quote>] [--space <space>] [--work] [--json]\n                                           Record a todo from this session; --work links this session as actively working on it\nfibo todo note <text|-> [--task <todo>]      Append progress: what is done, what remains, and decisions needed; users mark completion"
"fibo themes [文件或目录]                 按 App 的规则检查主题：跳过了什么、图在不在、对比度够不够\nfibo themes names                       列出主题能写的全部键" = "fibo themes [file-or-dir]                Validate themes with App rules: skipped keys, missing images, and contrast checks\nfibo themes names                       List every supported theme key"
"fibo plugins [--dir 目录] [--json]         检查插件能不能装上：哪个生效、哪个为什么没生效\nfibo plugins available [--remote]          列出可安装的插件（App 附带的，加 --remote 再查远程目录）\nfibo plugins install <id>[@版本] [--remote] [--yes]\n                                             安装或更新一个插件；会跑命令的要确认，非交互时加 --yes\nfibo plugins uninstall <id> [--force]      卸载一个插件；--force 在 teardown 失败时也卸（加载不了的按目录名卸）\nfibo plugins disable|enable <id> [--force]\n                                             停用或打开一个插件；--force 在 teardown 失败时也停用\nfibo plugins log <id>                      这个插件最近的运行：setup、hook、出过错的装饰和额度命令\nfibo plugins set <id> [<key> <值>]         看或改插件的设置项；值写 true/false、数字或文字\nfibo plugins run <id> <声明 id> [--event 事件] [--cwd 目录] [--send]\n                                             用和 App 一样的环境试跑一条 hook、装饰或额度命令，打印输出；\n                                             webhook 只显示会发什么，加 --send 才真发\nfibo plugins index <目录> [--check] [--key 私钥文件]\n                                             为插件目录生成 index.json 并签名（--check 只检查是否最新、签名对不对）\nfibo plugins keygen [--name 发布者] [--key 私钥文件]\n                                             生成发布者的签名私钥，默认 <配置>/publisher.key" = "fibo plugins [--dir DIR] [--json]          Check whether plugins load: which work, and why the others don't\nfibo plugins available [--remote]          List installable plugins (bundled with the app; --remote also asks the remote catalog)\nfibo plugins install <id>[@version] [--remote] [--yes]\n                                             Install or update a plugin; ones that run commands ask first, pass --yes when not interactive\nfibo plugins uninstall <id> [--force]      Remove a plugin; --force removes it even when teardown fails (one that won't load goes by folder name)\nfibo plugins disable|enable <id> [--force]\n                                             Turn a plugin off or on; --force turns it off even when teardown fails\nfibo plugins log <id>                      This plugin's recent runs: setup, hooks, decorations and quota commands that failed\nfibo plugins set <id> [<key> <value>]      Show or change the plugin's options; values are true/false, numbers or text\nfibo plugins run <id> <declared id> [--event EVENT] [--cwd DIR] [--send]\n                                             Try one hook, decoration or quota command in the app's environment and print its output;\n                                             a webhook only shows what it would send unless --send is given\nfibo plugins index <dir> [--check] [--key KEYFILE]\n                                             Generate and sign index.json for a plugin directory (--check only verifies it is current and signed)\nfibo plugins keygen [--name PUBLISHER] [--key KEYFILE]\n                                             Create a publisher signing key, by default <config>/publisher.key"
"fibo remote --stdio [--role view|answer|full]     给另一台机器或手机 App 用：一行一个 JSON 请求和回复（看画面、打字、按键、\n                                             答审批、事件），经 ssh 连过来：ssh 主机 fibo remote --stdio\nfibo remote --relay <中继地址> [--relay-key <密钥>] [--report]\n                                             连上中继并一直挂着，配对过的手机在哪都能连过来；内容端到端加密，\n                                             中继看不到。中继要密钥时也可以设 FIBO_RELAY_KEY（旧名 MOORING_RELAY_KEY 也认）；\n                                             --report 把连接状态报给后台（后台自己启动它时用）\nfibo remote pair --relay <中继地址> [--name 名字] [--role view|answer|full] [--new-code]\n                                             配对一台新手机，打印它的二维码和链接；权限分只看 / 能答审批 / 完全控制（默认）。\n                                             加 --new-code 换掉机器码，已配对的手机全部失效\nfibo remote pair --relay <中继地址> --computer --name <那台电脑的名字>\n                                             配对另一台电脑：它的窗口经中继连到这台，等于完全控制这台（和 ssh 进来一样）；\n                                             打印的链接在那台电脑上用 fibo remote join 加进去\nfibo remote join <配对链接> [--name <这台在那边叫什么>]\n                                             把经中继配对的电脑加进这台窗口的电脑列表，不用 ssh\nfibo remote dial --machine <名字> (--listen <socket> | --about)\n                                             窗口自己用：把那台电脑的后台经中继接到本地 socket，或打印那台的信息\nfibo remote enable --relay <中继地址> [--relay-key <密钥>] [--also <另一台中继> [--also-key <密钥>]]\n                                             让后台一直挂在中继上（重启后也会自动连回去）；配对保留。\n                                             --also 让它同时挂在另一台中继上，手机走先连通的那台；--also \"\" 去掉\nfibo remote disable                        断开中继，重启后也不再连；配对保留\nfibo remote status [--json]                中继连接状态、配对的手机、现在谁在线、在看哪个终端\nfibo remote kick <设备>                    立刻断开这台手机正连着的会话，配对保留\nfibo remote devices                        列出配对过的手机、权限和最近连接时间；操作记在运行目录的 remote-log.jsonl\nfibo remote device <设备> --role <view|answer|full>\n                                             改一台手机的权限；它正连着的会话一秒内断开，重连后按新权限\nfibo remote revoke <设备编号或名字>        取消一台手机的配对，它正连着的会话一秒内断开\nfibo remote machine-name <名字>            手机上这台电脑叫什么；给空字符串换回系统主机名，手机重连后显示新名字\n                                             旧写法 --pair --status --devices --device --kick --revoke --enable --disable\n                                             --machine-name --join --dial 照样能用" = "fibo remote --stdio [--role view|answer|full]     JSON-over-stdio transport for another Mac or phone app over SSH:\n                                             ssh <host> fibo remote --stdio\nfibo remote --relay <url> [--relay-key <key>] [--report]\n                                             Stay connected to a relay with end-to-end encryption for paired phones;\n                                             also reads FIBO_RELAY_KEY (or the old MOORING_RELAY_KEY);\n                                             --report reports connection state to the host\nfibo remote pair --relay <url> [--name NAME] [--role view|answer|full] [--new-code]\n                                             Pair a phone and print its QR code and link; roles are view only, answer\n                                             approvals, or full control (default). --new-code rotates the machine code\n                                             and unpairs every phone\nfibo remote pair --relay <url> --computer --name <its name>\n                                             Pair another computer: its window reaches this one through the relay with full\n                                             control, as ssh would give; add the printed link there with fibo remote join\nfibo remote join <link> [--name <name for it here>]\n                                             Add a computer paired through the relay to this window's machines, no ssh\nfibo remote dial --machine <name> (--listen <socket> | --about)\n                                             Used by the window: that computer's host through the relay on a local socket, or what it says it is\nfibo remote enable --relay <url> [--relay-key <key>] [--also <url> [--also-key <key>]]\n                                             Keep the host connected to a relay, also after a restart; pairings stay.\n                                             --also keeps it on a second relay too, and phones use whichever connects first; --also \"\" removes it\nfibo remote disable                        Disconnect from the relay and stay off after a restart; pairings stay\nfibo remote status [--json]                Relay connection, paired phones, who is online and which terminal they watch\nfibo remote kick <device>                  Disconnect this phone's live session now; the pairing stays\nfibo remote devices                        List paired phones, their roles and last connection; actions are logged in remote-log.jsonl\nfibo remote device <device> --role <view|answer|full>\n                                             Change a phone's role; its live session drops within a second and reconnects with it\nfibo remote revoke <device id or name>     Unpair a phone; its live session drops within a second\nfibo remote machine-name <name>            What phones call this computer; an empty string restores the host name\n                                             The old forms --pair --status --devices --device --kick --revoke --enable --disable\n                                             --machine-name --join --dial still work"
"fibo hooks install|uninstall [--agent <cli>]\n                                             把 Fibo 的 hook 写进（或移出）Agent CLI 自己的设置；不写 --agent 就是全部\nfibo hooks status [--agent <cli>] [--json] [--outdated-only]\n                                             各 CLI 的 hook 装了没有、和现在 install 会写的差在哪" = "fibo hooks install|uninstall [--agent <cli>]\n                                             Install or remove Fibo hooks in Agent CLI settings (all agents when --agent is omitted)\nfibo hooks status [--agent <cli>] [--json] [--outdated-only]\n                                             Check hook installation status and drift against current Fibo hooks"
"fibo hook --agent <claude|codex|grok>      Agent CLI 的 hook 调用的入口：从标准输入读一条 hook JSON（最多 1 MiB）\n                                             报给后台；不在 Fibo 终端里什么都不做。不用手动跑" = "fibo hook --agent <claude|codex|grok>      Hook callback entry point invoked by Agent CLIs: reads one hook JSON (up to 1 MiB)\n                                             from stdin and reports to the host; no-op outside Fibo terminals"
"fibo serve --runtime <目录> [--takeover] [--recent-days N]\n                                             启动后台（App 自己会启动，不用手动跑）；--takeover 从正在跑的后台\n                                             接过全部终端，--recent-days 只读最近 N 天的会话（默认 7）" = "fibo serve --runtime <dir> [--takeover] [--recent-days N]\n                                             Start the background host (started automatically by the App); --takeover adopts live terminals,\n                                             --recent-days limits session history scan to N days (default 7)"
"fibo socket                                打印后台的 socket 路径；另一台电脑的窗口经 ssh 连这台时用" = "fibo socket                                Print this host's socket path; another machine's window forwards to it over ssh"
"fibo scan --runtime <目录>                 让后台重新扫一遍 Agent 会话，打印会话数和终端数" = "fibo scan --runtime <dir>                  Rescan Agent sessions and print session and terminal counts"
"fibo --skill                               给 Coding Agent 看的用法说明（Markdown）\nfibo --skill plugins                       给 Coding Agent 看的写插件、改外观说明（Markdown）\nfibo --skill session                       Fibo 在会话开始时告诉 Agent 的话" = "fibo --skill                               Print the Markdown guide for coding agents driving Fibo\nfibo --skill plugins                       Print the Markdown guide for authoring Fibo plugins and themes\nfibo --skill session                       Print the brief session-start note injected for coding agents"
"fibo --version                             打印版本和协议版本" = "fibo --version                             Print version and protocol version"
"Fibo 没在运行：先打开 Fibo 再试（{err}）" = "Fibo isn't running: open Fibo, then try again ({err})"
"<终端> 可以是编号的前几位或标签名；全部命令都接受 --runtime <目录>；-h / --help 只打印用法、什么都不做。\nAgent 藏在包装器（沙盒、虚拟机、nono 等）后面认不出时，启动前设 FIBO_AGENT=<claude|codex|…>（旧名 MOORING_AGENT 也认）。" = "<terminal> accepts a unique ID prefix or tab title; every command accepts --runtime <dir>; -h / --help prints usage without side effects.\nWhen an Agent runs behind a wrapper (sandbox, VM, nono, etc.), set FIBO_AGENT=<claude|codex|...> before launching (the old name MOORING_AGENT works too)."

