"窗格标题栏显示上一条命令失败的退出码和 git 已暂存文件数，悬停标题看上一条命令用时和最近一次提交" = "Show failed exit codes and staged Git file counts in the title. Hover for command duration and the latest commit."
"项目自带的检查脚本" = "Project checks"
"把 just test、scripts/ci.sh 这类项目自己的检查命令也算作跑过验证" = "Count project commands such as just test and scripts/ci.sh as verification."
"状态左栏（WASM 示例）" = "Status sidebar (WASM example)"
"用 WebAssembly 写的左栏排法：需要你的置顶，在跑的列出，其余合成一行；跑在沙盒里，读不到文件和网络" = "A WebAssembly sidebar: conversations needing you first, running ones listed, and the rest folded. Sandboxed without file or network access."
"主题：磨砂玻璃" = "Theme: Frosted glass"
"一暗一亮两套半透明主题：窗口的底透出桌面并模糊，文字始终不透明" = "Dark and light translucent themes with a blurred desktop background and opaque text."
"主题：夜港" = "Theme: Night harbor"
"深蓝的夜，窗口底下是一片淡淡的港湾和月光。图片很淡，不抢终端的字" = "Deep blue with a subtle harbor and moonlight behind the window, keeping text clear."
"主题：旧纸" = "Theme: Old paper"
"米黄的纸，带一点纤维的纹理，字是墨色。白天看久了不刺眼" = "Warm paper with light fiber texture and dark ink for long daytime sessions."
"主题：潮汐与晨雾" = "Theme: Tide and mist"
"一暗一亮两套主题：潮汐是深青的底，晨雾是偏冷的纸白。装上后在设置 › 外观里选" = "Deep teal Tide and cool paper-white Mist. Select a theme in Settings › Appearance after installing."

