"Claude 额度" = "Claude quota"
"接上 Claude Code 的状态栏，把它给的 5 小时和每周额度显示在 Fibo 状态栏；原来的状态栏照常显示，卸载时还原。默认只读本机；打开「联网读 /usage」后，让 Claude Code 自己查额度，不用等状态栏刷新，还能看到按模型的周额度，不花钱也不留会话" = "Show Claude Code five-hour and weekly limits in the Fibo status bar. Keeps the existing status bar and restores it on uninstall. Local reads by default; optional online /usage refreshes limits and per-model weekly usage without paid requests or saved conversations."
"常用命令" = "Common commands"
"右键菜单与 ⌘P 里的几条常用命令，也是 actions.json 的写法示例" = "Common context-menu and Command Palette commands, with actions.json examples."
"完成动画：退格收工" = "Completion: Backspace"
"绿色光标把屏幕上的字一路删回开头，敲下做完了，然后飞进侧栏" = "A green cursor erases the text, types Done, and flies into the sidebar."
"完成动画：小猫" = "Completion: Cat"
"字符小猫 =- . -= 一只只睁开眼，变成 =^ . ^=，招招手，留下一串 :. 走进侧栏" = "Character cats open their eyes, wave, and leave tiny footprints toward the sidebar."
"完成动画：彩纸" = "Completion: Confetti"
"印章落下时彩纸炸开，配色跟随主题，最后飞进侧栏" = "Theme-colored confetti bursts as the stamp lands, then flies into the sidebar."
"完成动画：老显示器关机" = "Completion: CRT shutdown"
"屏幕闪一下白光，压成一条亮线，再缩成亮点飞进侧栏" = "The screen flashes, collapses to a line, then a dot that flies into the sidebar."
"完成动画：化进侧栏" = "Completion: Dissolve"
"标记完成时终端里的字化成光点流进侧栏那一行，印章最后飞进去" = "Terminal text becomes lights flowing into its sidebar row; the stamp follows."
"完成动画：字往下掉" = "Completion: Falling text"
"终端里的字一行行掉下来，弹一下堆在底部，再变成光点流进侧栏" = "Lines fall, bounce, and become lights flowing into the sidebar."
"完成动画：比心" = "Completion: Hearts"
"一个 <3 飘向字符 - _ -，它变成 ^ — ^，更多 <3 往上飘" = "A heart floats toward a sleepy face, which smiles as more hearts rise."
"完成动画：蹦回家" = "Completion: Hop home"
"字符 - _ - 很快变成 ^ — ^，一蹦一跳一路蹦回侧栏那一行" = "A character face smiles and hops back to its sidebar row."
"完成动画：靠岸" = "Completion: Moor"
"侧栏抛出缆绳勾住窗格，窗格缩成一张卡片，晃着被拉回侧栏那一行" = "A rope from the sidebar hooks the pane and pulls it home as a small card."
"完成动画：松口气" = "Completion: Relief"
"字符 - _ - 冒汗、深吸一口气、呼出一串 ~，变成 ^ — ^，说一声辛苦啦" = "A character face sweats, takes a breath, sighs, smiles, and says Thanks."
"完成动画：落印" = "Completion: Stamp"
"标记完成时印章压下来，冲击波和碎点溅开，再缩成小点飞进侧栏那一行" = "A stamp lands with a ripple and scattered dots, then flies into the sidebar."
"完成动画：小太阳" = "Completion: Sunrise"
"字符 - _ - 从一排 ____ 后面升起，天色变暖，\\ | / 光芒散开时变成 ^ — ^" = "A character sun rises from the horizon and smiles as its rays warm the sky."
"完成动画：扫光合上" = "Completion: Light sweep"
"标记完成时一道绿光扫过终端，窗格像眼皮一样合到一条线上，侧栏那一行亮起" = "Green light sweeps across the terminal; the pane closes and its sidebar row lights up."
"完成动画：漩涡" = "Completion: Swirl"
"终端里的字绕着中心卷进去，聚成一颗对勾，再飞进侧栏" = "Terminal text spirals into a checkmark and flies into the sidebar."
"完成动画：一杯热茶" = "Completion: Hot tea"
"字符茶杯 c[- _ -] 冒着 ~ 热气，暖了变成 c[^ — ^]，头顶冒出 <3" = "A steaming character teacup warms up, smiles, and sends up a heart."
"完成动画：睡醒了" = "Completion: Wake up"
"字符脸 = _ = 冒着 z 打瞌睡，睁一只眼，眨一下，一阵乱码后变成 ^ — ^" = "A sleepy character face opens one eye, blinks through a scramble, and smiles."
"专注左栏" = "Focus sidebar"
"左栏只摊开需要你的会话，其余都收成一行，每行带第二行说明" = "Expand conversations needing you; fold the rest into rows with a second line of detail."
"系统通知" = "System notifications"
"会话等你回答、出错或做完时弹一条 macOS 通知；App 没开也会发。可以设成只在出错时通知" = "Send macOS notifications for questions, errors, or completed conversations, even with the app closed. Can be limited to errors."
"从 OpenCode 的 SQLite 库读会话和子 Agent：父子归属、回合状态、权限提示和回答、中断、报错与改动证据" = "Read OpenCode SQLite sessions and subagents: parent links, turn state, permissions, answers, interruptions, errors, and change evidence."
