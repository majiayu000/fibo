# English for fibo-core runtime, workspace model, content summaries, quota, and diagnostics.

[agent]
"被后面的 {path} 取代" = "Replaced by later {path}"
"读不了：{e}#runtime" = "Couldn't read: {e}"
"格式不对：{e}#runtime" = "Invalid format: {e}"
"声明格式是 api {api}，这个版本只认 api 1 到 {max}" = "Declaration uses api {api}; this version only supports api 1 to {max}"
"id \"{id}\" 只能用小写字母、数字和 -，不超过 40 个字#runtime" = "id \"{id}\" may only contain lowercase letters, digits, and -, up to 40 characters"
"id \"{id}\" 和内置的 {name} 重名" = "id \"{id}\" conflicts with built-in {name}"
"executable 要写可执行文件名，不带路径" = "executable must be an executable name without a path"
"executable \"{exec}\" 已经是 {name} 的，同一个程序认不出是谁" = "executable \"{exec}\" already belongs to {name}; two agents cannot share one executable"
"start 和 resume 都要写命令" = "Both start and resume must specify a command"
"source 需要 api 2" = "source requires api 2"
"source.sqlite 要写绝对路径或 ~/ 开头" = "source.sqlite must be an absolute path or start with ~/"
"source.{name} 要写一条 SELECT 查询" = "source.{name} must be a SELECT query"
"source.poll_ms 要在 200 到 60000 之间" = "source.poll_ms must be between 200 and 60000"
"写了 source 也要写 transcripts，说明每行记录里的字段" = "When source is set, transcripts is also required to describe each row's fields"
"用 source 时不写 transcripts.root，记录由 Fibo 自己存放" = "Omit transcripts.root when using source; Fibo stores those records itself"
"transcripts.root 要写绝对路径或 ~/ 开头" = "transcripts.root must be an absolute path or start with ~/"
"transcripts 里的 \"{p}\" 要写成 / 开头的 JSON 指针" = "\"{p}\" in transcripts must be a JSON pointer starting with /"
"transcripts.events / parent 需要 api 2" = "transcripts.events and parent require api 2"
"transcripts.title 需要 api 2" = "transcripts.title requires api 2"
"transcripts.title \"{p}\" 要写成 / 开头的 JSON 指针" = "transcripts.title \"{p}\" must be a JSON pointer starting with /"
"events 第 {n} 条的 when 不能为空" = "events[{n}].when cannot be empty"
"events 第 {n} 条要写 turn、tool 或 result 之一" = "events[{n}] must specify turn, tool, or result"
"events 第 {n} 条的 tool 是 command，要写 command 指针" = "events[{n}].tool is command and needs a command pointer"
"events 第 {n} 条的 tool 是 edit，要写 path 指针" = "events[{n}].tool is edit and needs a path pointer"
"events 第 {n} 条的 \"{p}\" 要写成 / 开头的 JSON 指针" = "\"{p}\" in events[{n}] must be a JSON pointer starting with /"
"screen_rules、interrupt、answers 和 input_hint 需要 api 2" = "screen_rules, interrupt, answers, and input_hint require api 2"
"input_hint 不能有空字符串，否则任何画面都算输入框就绪" = "input_hint cannot contain an empty string, or every screen would match as input-ready"
"interrupt.key 只能是 esc 或 ctrl-c，不是 {other}" = "interrupt.key must be esc or ctrl-c, not {other}"
"interrupt.presses 要在 1 到 3 之间" = "interrupt.presses must be between 1 and 3"
"answers 的 pending、reply 要以 / 开头，reply 要含 {id}" = "answers.pending and answers.reply must start with /, and reply must include {id}"
"answers 里的指针要以 / 开头，subject 至少一个" = "Pointers in answers must start with /, with at least one subject"

