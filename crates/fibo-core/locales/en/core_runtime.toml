[diagnostics]
"本机资源诊断 · 开始于 {started} · 采样 {secs} 秒 · {status}\n" = "Local resource diagnostics · started {started} · sampled {secs}s · {status}\n"
"采样结束" = "complete"
"采样中（部分结果）" = "sampling (partial)"
"不可读#diag" = "unreadable"
"进程数：{procs}；CPU 核心：{cores}" = "Processes: {procs}; CPU cores: {cores}"
"整机 CPU 平均：{cpu}（所有核心合计）；最新 GPU 设备活跃度：{gpu}" = "System CPU average: {cpu} (across all cores); latest GPU device activity: {gpu}"
"内存：已用 {used} / {total}（{pct}，其中压缩 {comp}）；交换 {swap}；内存压力 {pressure}" = "Memory: {used} / {total} used ({pct}, compressed {comp}); swap {swap}; pressure {pressure}"
"排行前 {count} 项合计约 {listed} 核；整机忙碌中约 {rest} / {cores} 核没有归到任何应用（排行之外或采样间隙里的短命进程）。" = "Top {count} {count|entry totals|entries total} ~{listed} cores; ~{rest} / {cores} busy cores were not attributed to any app (outside the top list or short-lived processes between samples)."
"\nCPU 排行（100% = 一个核心）\n" = "\nTop CPU (100% = 1 core)\n"
"{name}：平均 {cpu}%" = "{name}: avg {cpu}%"
"，区间峰值 {peak}%" = ", peak {peak}%"
"，内存 {mem}，{procs} 个进程" = ", memory {mem}, {procs} {procs|process|processes}"
"，关联终端：{list}" = ", terminals: {list}"
"另有 {hidden} 个终端未在工作台打开" = "{hidden} more {hidden|terminal|terminals} not open in the workbench"
"\n内存排行（活动监视器「内存」列口径，含被压缩部分的原始大小，合计会超过已用）\n" = "\nTop Memory (Activity Monitor \"Memory\" column basis, including uncompressed size of compressed pages; sum may exceed used)\n"
"{name}：{mem}，{procs} 个进程" = "{name}: {mem}, {procs} {procs|process|processes}"
"按终端（整棵进程树，含 Agent 拉起的子进程）：" = "By terminal (full process tree, including child processes spawned by Agents): "
"\nGPU 活动排行（只占已观测计数增量的份额，不是整颗 GPU 利用率）\n" = "\nTop GPU Activity (share of observed counter deltas only, not overall GPU utilization)\n"
"没有可比较的 GPU 计数增量；不代表 GPU 空闲。\n" = "No comparable GPU counter deltas; this does not mean the GPU is idle.\n"
"{name}：已观测份额 {share}%" = "{name}: observed share {share}%"
"说明：{note}" = "Note: {note}"
"\n请根据以上测量分析占用来源，区分已证实、推测与未知。需要解释根因时先收集对应日志、流量或调用栈，不要仅凭排行判断卡死或直接结束进程。\n" = "\nAnalyze resource usage from these measurements, distinguishing confirmed facts, hypotheses, and unknowns. Gather logs, traffic, or stack traces before explaining root causes; do not assume a process is hung or kill it from rankings alone.\n"

