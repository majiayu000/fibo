[package]
name = "mooring-app"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
rustc-hash = "2"
mooring-core = { path = "../mooring-core" }
mooring-platform = { path = "../mooring-platform" }
# Other machines, over the same remote protocol the phone speaks.
mooring-remote = { path = "../mooring-remote" }
base64 = "0.22"
# Sandboxed WebAssembly for left-column plugins that need logic (`"group": "wasm"`).
mooring-plugin-host = { path = "../mooring-plugin-host" }
gpui = { path = "../../.deps/zed/crates/gpui" }
gpui_platform = { path = "../../.deps/zed/crates/gpui_platform", features = ["font-kit"] }
futures = "0.3"
# A theme's background picture; the same crate and version GPUI already builds.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde_json.workspace = true
serde.workspace = true
libc.workspace = true
# The pairing QR code a phone scans.
qrcode = { version = "0.14", default-features = false }

# Without a display server feature GPUI on Linux runs headless: a live app with no window.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { path = "../../.deps/zed/crates/gpui_platform", features = ["font-kit", "x11", "wayland"] }

[features]
visual-test = ["gpui/test-support", "gpui_platform/test-support"]

[[example]]
name = "terminal_reference"
required-features = ["visual-test"]

[[example]]
name = "paint_bench"
required-features = ["visual-test"]
