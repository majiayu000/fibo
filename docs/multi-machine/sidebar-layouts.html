<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多机侧栏布局</title>
<style>
:root{--page:#0f1114;--side:#15181d;--rail:#101317;--pane:#21252c;--raised:#262a31;--band:#1b1f25;--line:#2a2f37;--line2:#22262d;--strong:#3a404a;--text:#e4e4e7;--title:#ececee;--sec:#a2a2aa;--mut:#8d8d96;--green:#3fb27f;--yellow:#e5b83b;--orange:#e8823a}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font:14px/1.6 -apple-system,"PingFang SC",system-ui,sans-serif}
main{max-width:1440px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:20px;margin:0 0 4px}
main>p{margin:0 0 14px;color:var(--sec);font-size:13px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer}
button:focus-visible{outline:2px solid #6aa3ff;outline-offset:1px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.win{min-width:1360px;height:900px;display:flex;flex-direction:column;background:var(--pane)}
.body{flex:1;min-height:0;display:flex}
.lights{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--side);width:100%}
.lights i{width:12px;height:12px;border-radius:50%}
.rail{width:44px;flex:none;padding:6px 0 12px;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--rail);border-right:1px solid var(--line2);border-top:1px solid var(--line2)}
.rb{position:relative;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:#c9c9cf}
.rb:hover{background:var(--band)}
.rb.on{background:var(--raised);border-color:#565c67;color:var(--title)}
.rb.off{color:#7e848f;border-style:dashed}
.rb .badge{position:absolute;right:-5px;top:-5px;box-shadow:0 0 0 2px var(--rail)}
.side{width:316px;flex:none;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--line)}
.brand{height:28px;flex:none;padding:0 18px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--sec)}
.brand b{letter-spacing:3px;font-weight:600;color:var(--title)}
.brand .one{font-size:14px;font-weight:600;color:var(--title)}
.live{display:flex;align-items:center;gap:6px}
.dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--green)}
.dot.bad{background:#5a5f68}
.search{margin:8px 12px 0;height:30px;flex:none;padding:0 10px;display:flex;align-items:center;justify-content:space-between;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--mut)}
.mono{font-family:"SF Mono",Menlo,monospace;font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:10px 12px 0}
.chip{height:24px;padding:0 8px 0 6px;display:flex;align-items:center;gap:5px;border-radius:12px;border:1px solid var(--line);font-size:11.5px;color:#c9c9cf}
.sd{flex:none;width:7px;height:7px;border-radius:50%}
.chip .sd{width:9px;height:9px}
.badge{min-width:14px;height:14px;padding:0 4px;border-radius:7px;background:var(--orange);color:var(--side);font-size:9.5px;line-height:14px;font-weight:700;text-align:center}
.m{flex:none;width:15px;height:15px;display:flex;align-items:center;justify-content:center;border:1px solid #565c67;border-radius:4px;font-size:9.5px;line-height:1;font-weight:600;color:#c9c9cf}
.m.dim{color:var(--mut);border-color:var(--strong)}
.switch{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;color:var(--mut)}
.seg{padding:2px;display:flex;gap:2px;height:34px;border:1px solid var(--line);border-radius:8px}
.seg button{padding:0 14px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:13px;color:var(--sec)}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--title)}
.chip.on{background:var(--raised);border-color:#565c67}
.mchips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 12px 0;padding-top:8px;border-top:1px solid var(--line2)}
.mchips .chip{padding-left:5px}
.mchips .chip.off{color:var(--mut)}
.tune{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:7px;color:var(--sec)}
.tune:hover,.tune[aria-expanded=true]{background:var(--raised)}
.pop{position:absolute;right:8px;bottom:44px;z-index:3;width:252px;padding:6px;background:var(--band);border:1px solid var(--strong);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.pop .cap{padding:4px 8px 6px;font-size:11px;color:var(--mut)}
.pop button{width:100%;padding:6px 8px;display:flex;align-items:center;gap:8px;border-radius:6px;font-size:13px;color:var(--text)}
.pop button:hover{background:var(--raised)}
.pop .tick{flex:none;width:12px;color:var(--green)}
.list{flex:1;min-height:0;overflow:auto;padding-bottom:8px}
.grp{padding:12px 18px 5px;display:flex;align-items:center;gap:6px;font-size:11px;line-height:14px;color:var(--mut)}
.grp b{font-weight:500;color:var(--sec)}
.row{width:300px;margin:0 8px;padding:6px 10px;display:flex;align-items:flex-start;gap:9px;border-radius:6px;font-size:13px;line-height:18px;color:var(--text)}
.row:hover{background:var(--band)}
.row.sel{background:var(--raised)}
.row.off{color:var(--mut)}
.st{flex:none;display:block;width:10px;height:10px;margin-top:4px;border-radius:50%}
.st.review{border:2px solid var(--green)}
.st.running{border:2px solid var(--yellow);border-top-color:transparent}
.st.idle{width:8px;height:8px;margin:5px 1px 0;background:#6a6a72}
.st.off{width:8px;height:8px;margin:5px 1px 0;background:#5a5f68}
.x{flex:1;min-width:0;display:flex;flex-direction:column}
.t{display:flex;align-items:center;gap:6px}
.ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{flex:none;max-width:84px;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mut)}
.tm{flex:none;min-width:26px;text-align:right;font-family:"SF Mono",Menlo,monospace;font-size:11px;color:var(--mut)}
.sub{margin-top:2px;font-size:11.5px;color:var(--yellow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh{position:sticky;top:0;z-index:1;margin-top:10px;height:34px;padding:0 12px 0 14px;display:flex;align-items:center;gap:7px;background:var(--band);border-top:1px solid var(--line);border-bottom:1px solid var(--line2)}
.mh .toggle{flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--title)}
.mh .note{flex:1;min-width:0;font-size:11px;font-weight:400;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh .add{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--sec)}
.notice{margin:12px 12px 0;padding:10px 12px;background:var(--band);border:1px solid var(--line);border-radius:8px;font-size:12px;line-height:18px;color:#c9c9cf}
.btn{height:26px;padding:0 10px;display:inline-flex;align-items:center;border:1px solid var(--strong);border-radius:6px;font-size:12px;color:var(--text)}
.keys{width:100%;flex:none;padding:8px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--mut)}
.keys:hover{color:var(--text)}
.keys .mono{padding:0 4px;border:1px solid var(--line);border-radius:4px;margin-right:6px}
.foot{position:relative;flex:none;padding:7px 8px 9px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);font-size:12px;color:var(--sec)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.head{height:40px;flex:none;padding:0 12px 0 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);font-size:13px}
.head .name{font-weight:600}
.head .word{font-size:11px;color:var(--green)}
.head .word.running{color:var(--yellow)}
.head .word.none{color:var(--mut)}
.head .sp{flex:1}
.head .ghost{font-size:12px;color:var(--sec)}
.say{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--band);font-size:12.5px;color:#c9c9cf;display:flex;align-items:center;justify-content:space-between;gap:12px}
.term{flex:1;min-height:0;padding:14px 12px;font-family:"SF Mono",Menlo,monospace;font-size:14px;line-height:22px;color:#d6dbe3;overflow:hidden}
.prompt{background:#eef0f3;color:#15181d;padding:2px 8px;margin:16px -4px}
.dim{color:#7e848f}
.status{height:30px;flex:none;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);font-size:12px;color:var(--sec)}
.status span:first-child{display:flex;align-items:center;gap:6px}
</style>
</head>
<body>
<main>
<h1>多机侧栏：三种布局，随时切换</h1>
<p>A、B、C 各是一种完整布局，选哪个由你。窗口里的入口在侧栏右下角的调整按钮；上面这排只是方便试。点会话，右边跟着换；点 ⌘J 跳到下一个要你的。mac-mini 是示意数据。</p>
<div class="switch"><div class="seg" id="switch" role="group" aria-label="布局"></div></div>
<div class="scroll"><div class="win">
  <div class="lights" aria-hidden="true"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
  <div class="body">
    <nav class="rail" id="rail" aria-label="机器"></nav>
    <aside class="side" id="side"></aside>
    <section class="main" id="main"></section>
  </div>
</div></div>
</main>
<script>
const G={red:'linear-gradient(135deg,#f59e6b,#d9467a)',blue:'linear-gradient(135deg,#5ab0f0,#4b4fd6)',green:'linear-gradient(135deg,#7bd389,#2f9e66)',purple:'linear-gradient(135deg,#c04f9c,#8a5ad8)',indigo:'linear-gradient(135deg,#3d62c9,#7b8cf0)',gold:'linear-gradient(135deg,#8a6a2a,#b38a3a)'};
const MACHINES=[
  {id:'local',name:'本机',mark:'',online:true,today:47,older:65,chips:[['工作空间',G.red,2],['code',G.blue],['vsr',G.green,2],['code',G.purple],['litellm-rs',G.indigo],['her',G.gold],['mooring',G.red,1],['新空间',G.blue]]},
  {id:'apple',name:'apple',mark:'A',online:true,today:0,older:0,chips:[['code',G.blue,2],['mooring',G.red]]},
  {id:'mini',name:'mac-mini',mark:'M',online:false,today:0,older:0,chips:[['deploy',G.purple]]},
];
const s=(id,m,group,st,title,g,space,time,extra)=>Object.assign({id,m,group,st,title,g:G[g],space,time},extra||{});
const SESSIONS=[
  s('p1','local','pinned','review','超分炒粉测评','green','vsr','16时'),
  s('p2','local','pinned','running','多终端','red','工作空间','6:05',{sub:'正在运行 python3 -'}),
  s('a1','apple','needs','review','你好啊','blue','code','刚刚'),
  s('n1','local','needs','review','配色方案选项缺失','red','mooring','刚刚'),
  s('n2','local','needs','review','本机资源占用诊断报告','green','vsr','刚刚'),
  s('a2','apple','needs','review','w你好','blue','code','7时'),
  s('n3','local','needs','review','Write Me Down方向的AI角色','red','工作空间','14时'),
  s('n4','local','needs','review','Gödel, Escher, Bach 电子书','red','工作空间','23时'),
  s('m1','mini','needs','off','发布脚本检查','purple','deploy','断开'),
  s('r1','local','running','running','Crouton Alpha 隐身模型','blue','新空间','2:11'),
  s('r2','local','running','running','#1479 价格同步与 cargo 升级','indigo','litellm-rs','3:08'),
  s('r3','local','running','running','插件系统优化空间','red','mooring','7:01'),
  s('r4','local','running','running','Four_agents_write 后台 CPU','red','mooring','8:45'),
  s('a3','apple','today','idle','codex · 空闲 · 看不到对话','blue','code',''),
];
const LABEL={pinned:'置顶',needs:'要你处理',running:'在跑',today:'今天'};
const WORD={review:'等你验收',running:'在跑',idle:'空闲',off:'断开'};
const q=new URLSearchParams(location.hash.slice(1));
const LAYOUTS=[['a','A 一张清单'],['b','B 机器栏'],['c','C 按机器折叠']];
const selected=q.get('sel')||'a1';
const state={layout:q.get('layout')||'a',scope:q.get('scope')||SESSIONS.find(x=>x.id===selected).m,only:null,selected,folded:new Set(['mini']),menu:q.get('menu')==='1'};
const machine=id=>MACHINES.find(m=>m.id===id);
const inMachine=id=>SESSIONS.filter(x=>x.m===id);
const liveCount=id=>inMachine(id).filter(x=>x.st!=='off').length;
const needsCount=id=>machine(id).online?inMachine(id).filter(x=>x.group==='needs').length:0;
const mark=(m,dim)=>m.mark?`<span class="m${dim?' dim':''}">${m.mark}</span>`:'';
function row(x,showMark){
  const m=machine(x.m),off=x.st==='off';
  return `<button class="row${off?' off':''}${x.id===state.selected?' sel':''}" data-act="pick" data-id="${x.id}"><span class="st ${x.st}"></span><span class="x"><span class="t"><span class="ttl">${x.title}</span>${showMark?mark(m,off):''}<span class="tag"><span class="sd" style="background:${x.g}"></span>${x.space}</span><span class="tm">${x.time}</span></span>${x.sub?`<span class="sub">${x.sub}</span>`:''}</span></button>`;
}
function groups(items,showMark,today,older){
  let out='';
  for(const g of ['pinned','needs','running']){
    const rows=items.filter(x=>x.group===g);
    if(rows.length)out+=`<div class="grp"><b>${LABEL[g]}</b><span>${rows.length}</span></div>`+rows.map(x=>row(x,showMark)).join('');
  }
  const todays=items.filter(x=>x.group==='today');
  const total=todays.length+today;
  if(total){
    out+=`<div class="grp"><b>今天</b><span>${total}</span></div>`;
    if(total<=5)out+=todays.map(x=>row(x,showMark)).join('');
  }
  if(older)out+=`<div class="grp"><b>更早</b><span>${older}</span></div>`;
  return out;
}
function chips(ms){
  return `<div class="chips">`+ms.flatMap(m=>m.chips.map(c=>`<button class="chip">${ms.length>1?mark(m):''}<span class="sd" style="background:${c[1]}"></span>${c[0]}${c[2]?`<span class="badge">${c[2]}</span>`:''}</button>`)).join('')+`</div>`;
}
function renderSwitch(){
  document.getElementById('switch').innerHTML=LAYOUTS.map(([id,name])=>`<button data-act="layout" data-id="${id}" aria-pressed="${state.layout===id}">${name}</button>`).join('');
}
function renderRail(){
  const rail=document.getElementById('rail');
  rail.style.display=state.layout==='b'?'':'none';
  const icon=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">`;
  const each=MACHINES.map(m=>{
    const n=needsCount(m.id),label=`${m.name}${m.online?'':'，断开'}${n?`，${n} 个要你处理`:''}`;
    const face=m.id==='local'?`${icon}<rect x="5" y="5" width="14" height="10" rx="1.6"></rect><path d="M3 19h18"></path></svg>`:m.mark;
    return `<button class="rb${state.scope===m.id?' on':''}${m.online?'':' off'}" data-act="scope" data-id="${m.id}" aria-label="${label}" aria-pressed="${state.scope===m.id}">${face}${n?`<span class="badge">${n}</span>`:''}</button>`;
  }).join('');
  rail.innerHTML=each+`<span style="flex:1"></span><button class="rb" style="border:1px dashed #4a4a54;color:var(--mut);font-weight:400" aria-label="添加一台电脑">+</button>`;
}
function renderSide(){
  const online=MACHINES.filter(m=>m.online),local=machine('local');
  let html='';
  if(state.layout!=='b'){
    html+=`<div class="brand"><b>MOORING</b></div><div class="search"><span>找会话、空间或原话</span><span class="mono">⌘P</span></div>`;
    if(state.layout==='a'){
      html+=chips([local]);
      html+=`<div class="mchips">`+MACHINES.filter(m=>m.mark).map(m=>{
        const n=needsCount(m.id);
        return `<button class="chip${m.online?'':' off'}${state.only===m.id?' on':''}" data-act="only" data-id="${m.id}" aria-pressed="${state.only===m.id}">${mark(m,!m.online)}${m.name}${m.online?'':' · 断开'}${n?`<span class="badge">${n}</span>`:''}</button>`;
      }).join('')+`</div>`;
    }
    html+=`<div class="list">`;
    if(state.layout==='a'){
      const ms=state.only?[machine(state.only)]:MACHINES;
      html+=groups(state.only?inMachine(state.only):SESSIONS,!state.only,ms.reduce((a,m)=>a+m.today,0),ms.reduce((a,m)=>a+m.older,0));
    }else{
      for(const m of MACHINES){
        const folded=state.folded.has(m.id),n=needsCount(m.id);
        const note=m.online?`${liveCount(m.id)} 个会话`:'断开 · 12 秒后重试';
        html+=`<div class="mh"><button class="toggle" data-act="fold" data-id="${m.id}" aria-expanded="${!folded}"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="${folded?'M3.5 2l3 3-3 3':'M2 3.5l3 3 3-3'}"></path></svg>${mark(m,!m.online)}${m.name}<span class="note">${note}</span>${n?`<span class="badge">${n}</span>`:''}</button>${m.online?`<button class="add" aria-label="在${m.name}上开新终端">+</button>`:''}</div>`;
        if(!folded)html+=(m.id==='local'?chips([m]):'')+groups(inMachine(m.id),false,m.today,m.older);
      }
    }
    html+=`</div>`;
  }else{
    const m=machine(state.scope);
    html+=`<div class="brand"><span class="one">${m.name}</span><span class="live"><span class="dot${m.online?'':' bad'}"></span>${m.online?'在线':'断开'}</span></div><div class="search"><span>找这台的会话</span><span class="mono">⌘P</span></div>`;
    html+=chips([m]);
    if(!m.online)html+=`<div class="notice">连不上这台电脑，下面是断开前的会话，状态可能已经变了。12 秒后重试。<br><button class="btn" style="margin-top:8px">立刻重连</button></div>`;
    html+=`<div class="list">${groups(inMachine(m.id),false,m.today,m.older)}</div>`;
  }
  html+=`<button class="keys" data-act="next"><span class="mono">⌘J</span>下一个要你的（所有机器）</button>`;
  const foot=state.layout!=='b'
    ?`${online.length}/${MACHINES.length} 台在线 · ${online.reduce((a,m)=>a+m.chips.length,0)} 个空间 · ${online.reduce((a,m)=>a+liveCount(m.id),0)} 个会话`
    :`${machine(state.scope).chips.length} 个空间 · ${inMachine(state.scope).length} 个会话`;
  const menu=state.menu?`<div class="pop"><div class="cap">多台机器的布局</div>`+LAYOUTS.map(([id,name])=>`<button data-act="layout" data-id="${id}" role="menuitemradio" aria-checked="${state.layout===id}"><span class="tick">${state.layout===id?'✓':''}</span>${name}</button>`).join('')+`</div>`:'';
  html+=`<div class="foot"><span>${foot}</span><button class="tune" data-act="menu" aria-label="调整布局" aria-expanded="${state.menu}"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M4 16h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path><circle cx="9" cy="8" r="2.6" fill="currentColor"></circle><circle cx="15" cy="16" r="2.6" fill="currentColor"></circle></svg></button>${menu}</div>`;
  document.getElementById('side').innerHTML=html;
}
function renderMain(){
  const x=SESSIONS.find(v=>v.id===state.selected),m=machine(x.m),off=x.st==='off';
  const wordClass=x.st==='running'?' running':(x.st==='idle'||off)?' none':'';
  const dotColor={review:'var(--green)',running:'var(--yellow)',idle:'#6a6a72',off:'#5a5f68'}[x.st];
  const title=m.mark?`${m.name} · ${x.title}`:x.title;
  const talk=x.id==='a1'
    ?`<div class="prompt">❯ 你好啊</div><div>● 你好！有什么需要帮忙的吗？写代码、调试问题、分析项目都可以。</div><div class="dim" style="margin-top:12px">* Brewed for 6s · done 12:32 AM</div><div class="prompt">❯ 嗯嗯</div><div>● 嗯，随时说就行，我在这儿等着。</div><div class="dim" style="margin-top:12px">* Brewed for 6s · done 10:54 AM</div>`
    :`<div class="dim" style="margin-top:16px">这里是「${x.title}」的终端画面</div>`;
  document.getElementById('main').innerHTML=
    `<div class="head"><span class="sd" style="width:8px;height:8px;background:${dotColor}"></span>${mark(m,off)}<span class="name">${title}</span><span class="word${wordClass}">${WORD[x.st]}</span><span class="sp"></span>${m.mark&&!off?'<button class="ghost">关闭终端</button>':''}</div>`
    +(off?`<div class="say"><span>连接断开，下面是断开时的画面，状态可能已经变了。12 秒后重试。</span><button class="btn">立刻重连</button></div>`:'')
    +`<div class="term"><div>Claude Code <span class="dim">v2.1.300</span></div><div class="dim">Opus 5.5 · Claude Pro</div><div class="dim">~/Desktop/code</div>${talk}</div>`
    +`<div class="status"><span><span class="dot${m.online?'':' bad'}"></span>${m.name} · ${m.online?liveCount(m.id)+' 个会话':'断开'}</span><span>5h 2% · 周 58% · 本机诊断 · ⌘P 命令</span></div>`;
}
function render(){renderSwitch();renderRail();renderSide();renderMain();}
function nextNeeding(){
  const list=SESSIONS.filter(x=>x.group==='needs'&&x.st!=='off');
  const at=list.findIndex(x=>x.id===state.selected);
  const to=list[(at+1)%list.length];
  state.selected=to.id;
  state.scope=to.m;
  if(state.only&&state.only!==to.m)state.only=null;
  state.folded.delete(to.m);
}
function setLayout(id){
  const m=SESSIONS.find(x=>x.id===state.selected).m;
  state.layout=id;
  state.only=null;
  state.scope=m;
  state.folded.delete(m);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  const {act,id}=b?b.dataset:{};
  const wasOpen=state.menu;
  state.menu=act==='menu'?!wasOpen:false;
  if(!b){if(wasOpen)render();return;}
  if(act==='layout')setLayout(id);
  if(act==='scope')state.scope=id;
  if(act==='only')state.only=state.only===id?null:id;
  if(act==='pick')state.selected=id;
  if(act==='fold')state.folded.has(id)?state.folded.delete(id):state.folded.add(id);
  if(act==='next')nextNeeding();
  render();
});
render();
</script>
</body>
</html>
