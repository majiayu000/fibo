<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mooring 一条列表</title>
<style>
:root{--ask:#E8732C;--rev:#3FB27F;--run:#E5B83B;--bg:#08080A;--sb:#0C0C0F;--line:#1C1C21;--t1:#ECECEE;--t2:#A2A2AA;--t3:#7E7E87}
body{margin:0;background:#C9C6BF;font-family:-apple-system,'PingFang SC','Helvetica Neue',sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace}
header.page{max-width:1440px;margin:0 auto;padding:24px 16px 14px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center}
header.page h1{margin:0;font-size:18px;color:#1C1B19}
header.page p{margin:0;font-size:12px;color:#3A3935;flex:1 1 420px;line-height:1.6}
header.page b{color:#1C1B19}
.stage{overflow-x:auto;padding:0 16px 48px}
.win{position:relative;width:1440px;height:900px;margin:0 auto;display:flex;border-radius:12px;overflow:hidden;background:var(--bg);color:var(--t1);box-shadow:0 0 0 1px rgba(0,0,0,.25),0 30px 70px rgba(0,0,0,.28)}
.lights{position:absolute;left:18px;top:16px;display:flex;gap:8px;z-index:5}
.lights i{width:12px;height:12px;border-radius:50%;background:#FF5F57}
.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.st{display:inline-block;width:8px;height:8px;border-radius:50%;box-sizing:border-box;flex-shrink:0}
.st.a{background:var(--ask);box-shadow:0 0 8px rgba(232,115,44,.75)}
.st.r{border:1.5px solid var(--rev)}
.st.u{border:1.5px solid var(--run);border-top-color:transparent}
.st.i{border:1.5px solid #45454D}
.st.d{width:9px;height:9px;border-radius:0;background:none;position:relative}
.st.d::after{content:"";position:absolute;left:2px;top:0;width:3px;height:6px;border:solid #6A6A72;border-width:0 1.5px 1.5px 0;transform:rotate(40deg)}
.ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:11px;color:var(--t3);flex-shrink:0;width:26px;text-align:right}
.ib{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--t2)}
.ib:hover{background:#18181D}

/* ---------- sidebar ---------- */
.sb{width:316px;flex-shrink:0;background:var(--sb);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:8px;padding:44px 12px 0 18px;font-size:11px;letter-spacing:.18em;color:var(--t3)}
.brand b{color:var(--t1);font-weight:600}
.brand .host{margin-left:auto;letter-spacing:0;display:flex;align-items:center;gap:6px}
.brand .host i{width:6px;height:6px;border-radius:50%;background:var(--rev);box-shadow:0 0 8px var(--rev)}
.searchbox{margin:12px 12px 0;height:30px;border-radius:8px;border:1px solid #1F1F25;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--t3)}
.searchbox input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--t1);font:12px -apple-system,'PingFang SC',sans-serif}
.searchbox input::placeholder{color:var(--t3)}
.searchbox kbd{font:11px 'SF Mono',Menlo,monospace;color:var(--t3)}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:10px 12px 2px}
.chip{display:flex;align-items:center;gap:5px;height:24px;padding:0 8px 0 6px;border-radius:12px;border:1px solid #23232A;font-size:11.5px;color:#C9C9CF;transition:opacity .15s}
.chip .d{width:9px;height:9px;border-radius:50%}
.chip .n{min-width:14px;height:14px;padding:0 4px;box-sizing:border-box;border-radius:7px;background:var(--ask);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.chip:hover{border-color:#3A3A42}
.chip.on{background:#1C1C22;border-color:#4A4A54;color:#fff}
.chips.filtered .chip:not(.on){opacity:.5}
.scope{display:none;align-items:center;gap:8px;margin:10px 12px 0;padding:8px 10px;border-radius:10px;background:#121216;border:1px solid #23232A;font-size:12px}
.scope.show{display:flex}
.scope .d{width:12px;height:12px;border-radius:50%}
.scope b{font-weight:600}
.scope{white-space:nowrap}.scope span{color:var(--t3)}.scope .mono{overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:11px}
.scope .x{margin-left:auto}
.list{flex:1;min-height:0;overflow-y:auto;padding-bottom:12px;scrollbar-width:thin;scrollbar-color:#2A2A31 transparent}
.grp{display:flex;align-items:center;gap:6px;padding:14px 18px 5px;font-size:11px;color:var(--t3);letter-spacing:.06em}
.grp b{color:var(--t2);font-weight:500}
.grp .r{margin-left:auto;letter-spacing:0}
.row{display:flex;gap:9px;align-items:flex-start;margin:0 8px;padding:6px 10px;border-radius:7px;width:calc(100% - 16px);box-sizing:border-box}
.row:hover{background:#131317}
.row .st{margin-top:4px}
.row .x{flex:1;min-width:0}
.row .t{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#E4E4E7}
.row .t .ttl{flex:1}
.row .s{font-size:11.5px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s.q{color:#F29A61}
.row.one{align-items:center;padding:5px 10px}
.row.one .st{margin-top:0}
.row.one .t{color:#C9C9CF}.row.live .t{color:#E4E4E7}
.row.dim .t{color:var(--t2)}
.row.sel{background:#17171C;box-shadow:inset 0 0 0 1px #2A2A31}
.tag{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t3);max-width:76px;flex-shrink:0}
.tag i{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.tag em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filtered-list .tag{display:none}
.more{display:flex;align-items:center;gap:8px;margin:2px 8px 0;padding:6px 10px;border-radius:7px;font-size:12px;color:var(--t3);width:calc(100% - 16px);box-sizing:border-box}
.more:hover{background:#131317;color:var(--t2)}
.empty{padding:20px 18px;font-size:12px;color:var(--t3)}
.foot{display:flex;align-items:center;gap:4px;padding:8px 10px 10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--t2)}
.foot span{margin-right:auto}
.keys{display:flex;gap:10px;padding:8px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--t3)}
.keys kbd{font:10.5px 'SF Mono',Menlo,monospace;color:var(--t2);border:1px solid #2A2A31;border-radius:4px;padding:1px 4px;margin-right:4px}

/* ---------- main (shared) ---------- */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:52px;display:flex;align-items:center;gap:4px;padding:0 12px;border-bottom:1px solid var(--line)}
.tab{height:30px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:7px;font-size:12.5px;color:var(--t3);white-space:nowrap}
.tab .sd{width:8px;height:8px;border-radius:50%}
.tab.on{color:#fff;background:#141418;box-shadow:inset 0 0 0 1px #26262D}
.need{margin-left:auto;height:30px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:7px;font-size:12.5px;color:#F6B48A;background:rgba(232,115,44,.12);box-shadow:inset 0 0 0 1px rgba(232,115,44,.35);white-space:nowrap}
.need kbd{font:11px 'SF Mono',Menlo,monospace;color:#C9875D}
.ghost{height:30px;padding:0 10px;font-size:12.5px;color:var(--t2);white-space:nowrap}
.crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t3);margin-right:6px;white-space:nowrap}
.crumb i{width:8px;height:8px;border-radius:50%}
.panes{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.col{display:grid;grid-template-rows:1fr 1fr;gap:10px;min-height:0}
.pane{background:#0E0E11;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pane.ask{border-color:rgba(232,115,44,.7);box-shadow:0 0 0 1px rgba(232,115,44,.25),0 0 40px rgba(232,115,44,.12)}
.ph{height:42px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid #1A1A1F;font-size:12.5px;white-space:nowrap}
.ph .p{color:var(--t3);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.tagx{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11.5px;height:22px;padding:0 8px;border-radius:6px;flex-shrink:0}
.tagx.a{color:#F6B48A;background:rgba(232,115,44,.14)} .tagx.r{color:#8FE0B8;background:rgba(63,178,127,.13)}
.rb{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #1A1A1F;font-size:12px;color:var(--t2);white-space:nowrap}
.rb b{color:#8FE0B8;font-weight:500}
.rb .bt{height:26px;padding:0 10px;border-radius:6px;border:1px solid #2A2A31;color:#D4D4D8;font-size:12px}
.rb .bt.p{background:#ECECEE;color:#08080A;border-color:#ECECEE;font-weight:600}
.term{flex:1;padding:14px 16px;font-size:13px;line-height:1.75;color:#D4D4D8;overflow:hidden}
.term .c{color:var(--t3)}
.qa{margin:0 12px 12px;border-radius:10px;border:1px solid rgba(232,115,44,.35);background:linear-gradient(180deg,rgba(232,115,44,.09),rgba(232,115,44,.03));padding:12px}
.qa .h{font-size:13px;color:#F6B48A;margin-bottom:8px;display:flex;justify-content:space-between}
.qa .h span{color:var(--t3);font-size:11px}
.opt{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:7px;font-size:13px;color:#C9C9CF;width:100%;box-sizing:border-box}
.opt kbd{width:18px;height:18px;border-radius:4px;border:1px solid #3A3A42;font:11px/16px 'SF Mono',Menlo,monospace;text-align:center;color:var(--t2);box-sizing:border-box}
.opt.on{background:rgba(232,115,44,.14);color:#fff}
.opt.on kbd{border-color:var(--ask);color:#F6B48A}
.opt em{margin-left:auto;font-style:normal;font-size:11px;color:#C9875D}
.status{height:30px;display:flex;align-items:center;gap:14px;padding:0 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--t3);white-space:nowrap}
.meter{display:flex;align-items:center;gap:6px}
.blk{display:flex;gap:2px}
.blk i{width:4px;height:10px;border-radius:1px;background:#26262C}
.blk i.f{background:var(--t2)} .blk i.w{background:var(--run)}

</style>
</head>
<body>
<header class="page">
  <h1>Mooring · 一条列表，空间当标签</h1>
  <p>按你的回答改：空间只是标签，不再要你先点空间再点会话。<b>可以直接点着试：</b>点顶部空间标签就地筛选（再点一次取消），搜索框能打字，「更早」能展开。44 个会话、7 个空间。</p>
</header>
<div class="stage">
  <div class="win">
    <div class="lights"><i></i><i></i><i></i></div>
    <aside class="sb">
      <div class="brand"><b>MOORING</b><span class="host"><i></i>本机</span><button class="ib" aria-label="新会话"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button></div>
      <label class="searchbox"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg><input id="q" placeholder="找会话、空间或原话" aria-label="搜索会话"><kbd>⌘K</kbd></label>
      <div class="chips" id="chips"></div>
      <div class="scope" id="scope"></div>
      <div class="list" id="list"></div>
      <div class="keys"><span><kbd>⌘J</kbd>下一个要你的</span><span><kbd>⌃Tab</kbd>上一个会话</span></div>
      <div class="foot"><span>本机 · 7 个空间 · 44 个会话</span>
        <button class="ib" aria-label="连接手机"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="4.5" y="1.5" width="7" height="13" rx="1.6"/><path d="M7 12.2h2"/></svg></button>
        <button class="ib" aria-label="设置"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></svg></button>
      </div>
    </aside>
    <div id="mainslot" style="flex:1;min-width:0;display:flex"></div>
  </div>
</div>
<template id="main">
  <main>
    <div class="top">
      <span class="crumb"><i class="g1"></i>工作空间 /</span>
      <button class="tab on"><span class="st a"></span>标签命名依旧有问题<span style="color:#77777F">×</span></button>
      <button class="tab"><span class="st r"></span>查 tab_name 从哪来</button>
      <button class="tab"><span class="st r"></span>核对标签测试</button>
      <button class="tab">+</button>
      <button class="need">要你处理 <b class="mono">12</b><kbd>⌘J 下一个</kbd></button>
      <button class="ghost">鸟瞰</button>
    </div>
    <div class="panes">
      <section class="pane ask">
        <div class="ph"><b>Codex</b><span class="p mono">~/…/projects/工作空间</span><span class="tagx a"><span class="st a" style="width:6px;height:6px"></span>等你回答 · 1m</span></div>
        <div class="term mono"><div>› 修标签命名</div><div>&nbsp;</div><div class="c">• 已读取项目上下文</div><div class="c">• 找到两处会改写标签名：tabs.rs、sessions.rs</div><div>&nbsp;</div><div>退出后重新打开，标签名要不要沿用上次的？</div></div>
        <div class="qa">
          <div class="h">退出后标签名要不要保留？<span class="mono">↑↓ 选 · ↵ 发送</span></div>
          <button class="opt on"><kbd>1</kbd>保留，重开时沿用上次的名字<em>我倾向</em></button>
          <button class="opt"><kbd>2</kbd>不保留，每次按第一句话重新起名</button>
          <button class="opt"><kbd>3</kbd>自己写…</button>
        </div>
      </section>
      <div class="col">
        <section class="pane">
          <div class="ph"><b>Codex</b><span class="p mono">~/…/projects/工作空间</span><span class="tagx r">等你验收 · 2m</span></div>
          <div class="rb"><b>改了 1 个文件</b><span>· 验收标准 0/3</span><span style="flex:1"></span><button class="bt">看改动</button><button class="bt">退回</button><button class="bt p">标记完成</button></div>
          <div class="term mono"><div>› 查 tab_name 从哪来</div><div>&nbsp;</div><div class="c">• tab_name 来自 sessions.rs 的 first_prompt()</div><div class="c">• 改成优先用用户改过的名字</div><div>&nbsp;</div><div>✓ 已完成，等你验收。</div></div>
        </section>
        <section class="pane">
          <div class="ph"><b>Codex</b><span class="p mono">~/…/projects/工作空间</span><span class="tagx r">等你验收 · 3m</span></div>
          <div class="rb"><b>这一轮做完了</b><span>· 验收标准 0/3</span><span style="flex:1"></span><button class="bt">看改动</button><button class="bt">退回</button><button class="bt p">标记完成</button></div>
          <div class="term mono"><div>› 核对标签测试</div><div>&nbsp;</div><div class="c">• cargo test -p mooring-app tabs</div><div class="c">  test result: ok. 14 passed</div><div>&nbsp;</div><div>✓ 已完成，请核对。</div></div>
        </section>
      </div>
    </div>
    <div class="status mono">
      <span style="margin-right:auto">⌘P 命令</span>
      <span class="meter">CODEX 5h<span class="blk"><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i></i><i></i><i></i><i></i><i></i><i></i></span>42%</span>
      <span class="meter">周<span class="blk"><i class="f"></i><i class="f"></i><i class="f"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>31%</span>
      <span class="meter">CLAUDE 5h<span class="blk"><i class="f"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>12%</span>
      <span class="meter">周<span class="blk"><i class="w"></i><i class="w"></i><i class="w"></i><i class="w"></i><i class="w"></i><i class="w"></i><i></i><i></i><i></i><i></i></span>64%</span>
      <span>本机诊断</span>
    </div>
  </main>
</template>
<script>
const G={
  g1:'linear-gradient(135deg,#8B7BFF,#F06CB4)', g2:'linear-gradient(135deg,#4FB0FF,#5E5BE0)',
  g3:'linear-gradient(135deg,#2CC3B0,#3E7CF0)', g4:'linear-gradient(135deg,#FF8A4C,#FFC94D)',
  g5:'linear-gradient(135deg,#7BD86A,#1FA37A)', g6:'linear-gradient(135deg,#9AA3B5,#5D6779)',
  g7:'linear-gradient(135deg,#FF7A8A,#FFB36B)'
};
// [title, status, age, note]
const SPACES=[
 {n:'工作空间',g:'g1',p:'~/projects/工作空间',s:[
  ['标签命名依旧有问题','a','1m','退出后标签名要不要保留？'],['查 tab_name 从哪来','r','2m','改了 1 个文件 · 0/3'],['核对标签测试','r','3m','这一轮做完了'],
  ['健身计划表','i','1d'],['发票整理脚本','i','3d'],['读书笔记归档','i','5d'],['周报模板','d','2d'],['旅行清单','d','6d']]},
 {n:'mooring',g:'g2',p:'~/AI/tools/mooring',s:[
  ['窄窗格标题栏','a','6m','截断时优先保留哪段？'],['手机配对重连','u','3m','在跑 cargo test'],['插件系统与市场','u','12m','在跑 cargo test'],['Skill 收录情况','r','34m','+128 −14'],
  ['库中 UI 组件现状','i','4h'],['任务完成判定','i','5h'],['额度条摆放','i','1d'],['中继鉴权','i','2d'],['右键菜单置顶','d','6h'],['PTY 停顿压测','d','8h'],['汉字宽度回退','d','1d'],['鸟瞰五列','d','2d']]},
 {n:'code',g:'g3',p:'~/code',s:[
  ['网站可借鉴之处','a','2m','侧栏参考哪两家？'],['SSH 执行异常','a','10m','退出码 255，要不要换 key？'],['迁移旧会话表','u','40m','第 2 步'],['订单导出 CSV','r','1h','3/3 通过'],
  ['灰度比例 20%','i','1d'],['聊天记录与多终端','d','7h']]},
 {n:'模型上线 work',g:'g4',p:'~/work/model-launch',s:[
  ['推送前确认 PR 标题','a','3m','改动已完成，是否允许推送？'],['反馈接口限流','u','25m','压测中'],['空状态文案改写','r','50m','2/3'],['回滚演练','i','2d'],['监控面板','i','3d']]},
 {n:'codex-mall',g:'g5',p:'~/code/codex-mall',s:[
  ['商品详情页缓存','u','1m','0:41'],['支付回调幂等','r','2h','改了 4 个文件'],['购物车并发','i','1d'],['优惠券过期','i','2d'],['图片 CDN','i','4d'],['搜索排序','d','3d']]},
 {n:'lib',g:'g7',p:'~/code/lib',s:[
  ['偷看时左栏同时标两处','r','2h','4/4'],['日志分级','i','2d'],['按 rustfmt 折行','d','1h']]},
 {n:'sys',g:'g6',p:'~/sys',s:[
  ['清理旧扫描轮询','i','1d'],['给 CLI 加离线模式','i','2d'],['Windows 路径兼容','i','3d'],['磁盘告警','d','4d']]},
];

const SEL='标签命名依旧有问题';
const SHORT={'模型上线 work':'模型上线','codex-mall':'mall'};
const mins=a=>{const n=parseFloat(a);return a.endsWith('m')?n:a.endsWith('h')?n*60:n*1440};
const all=SPACES.flatMap(sp=>sp.s.map(s=>({sp,t:s[0],k:s[1],age:s[2],note:s[3]||''})));
const state={space:null,q:'',old:false};
const params=new URLSearchParams(location.search);
if(params.get('space'))state.space=params.get('space');
if(params.get('old'))state.old=true;
const st=k=>`<span class="st ${k}"></span>`;
const tag=sp=>`<span class="tag"><i style="background:${G[sp.g]}"></i><em>${SHORT[sp.n]||sp.n}</em></span>`;

function chips(){
  const el=document.getElementById('chips');
  el.classList.toggle('filtered',!!state.space);
  el.innerHTML=SPACES.map(sp=>{
    const need=sp.s.filter(s=>s[1]==='a'||s[1]==='r').length;
    return `<button class="chip${state.space===sp.n?' on':''}" data-sp="${sp.n}"><span class="d" style="background:${G[sp.g]}"></span>${SHORT[sp.n]||sp.n}${need?`<span class="n">${need}</span>`:''}</button>`;
  }).join('');
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{state.space=state.space===b.dataset.sp?null:b.dataset.sp;render()});
  const sc=document.getElementById('scope');
  const sp=SPACES.find(x=>x.n===state.space);
  sc.classList.toggle('show',!!sp);
  if(sp) sc.innerHTML=`<span class="d" style="background:${G[sp.g]}"></span><b>${sp.n}</b><span class="mono">${sp.p}</span><span>· ${sp.s.length} 个</span><button class="ib x" aria-label="取消筛选">✕</button>`,
    sc.querySelector('.x').onclick=()=>{state.space=null;render()};
}

function row(x){
  const sel=x.t===SEL?' sel':'';
  if(x.k==='a'){
    const sub=x.k==='a'?`<span class="s q">问：${x.note}</span>`:`<span class="s">${x.note}</span>`;
    return `<button class="row${sel}">${st(x.k)}<span class="x"><span class="t"><span class="ttl">${x.t}</span>${tag(x.sp)}<span class="tm mono">${x.age}</span></span>${x.note?sub:''}</span></button>`;
  }
  return `<button class="row one${x.k==='d'?' dim':''}${'ru'.includes(x.k)?' live':''}${sel}">${st(x.k)}<span class="x"><span class="t"><span class="ttl">${x.t}</span>${tag(x.sp)}<span class="tm mono">${x.age}</span></span></span></button>`;
}

function render(){
  chips();
  const q=state.q.trim();
  let xs=all.filter(x=>(!state.space||x.sp.n===state.space)&&(!q||x.t.includes(q)||x.note.includes(q)||x.sp.n.includes(q)));
  xs.sort((a,b)=>mins(a.age)-mins(b.age));
  const desc=(a,b)=>mins(b.age)-mins(a.age);const need=xs.filter(x=>x.k==='a').sort(desc).concat(xs.filter(x=>x.k==='r').sort(desc));
  const run=xs.filter(x=>x.k==='u');
  const rest=xs.filter(x=>x.k==='i'||x.k==='d');
  const today=rest.filter(x=>mins(x.age)<1440), older=rest.filter(x=>mins(x.age)>=1440);
  const showOld=state.old||!!state.space||!!q;
  let h='';
  if(need.length){h+=`<div class="grp"><b>要你处理</b>${need.length}<span class="r">回答在前 · 等得久的在前</span></div>`+need.map(row).join('')}
  if(run.length){h+=`<div class="grp"><b>在跑</b>${run.length}</div>`+run.map(row).join('')}
  if(today.length){h+=`<div class="grp"><b>今天</b>${today.length}</div>`+today.map(row).join('')}
  if(older.length){
    if(showOld) h+=`<div class="grp"><b>更早</b>${older.length}</div>`+older.map(row).join('');
    else h+=`<button class="more" id="old">${st('i')}更早 ${older.length} 个 · 停着或做完了<span style="margin-left:auto">▸</span></button>`;
  }
  if(!xs.length) h=`<div class="empty">没有找到「${q}」</div>`;
  const L=document.getElementById('list');
  L.innerHTML=h;L.classList.toggle('filtered-list',!!state.space);
  const o=document.getElementById('old'); if(o) o.onclick=()=>{state.old=true;render()};
}
document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value;render()});
document.getElementById('mainslot').outerHTML=document.getElementById('main').innerHTML;
document.querySelectorAll('.crumb i').forEach(e=>e.style.background=G.g1);
render();
</script>
</body>
</html>
