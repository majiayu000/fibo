<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mooring 图标全集</title>
<style>
:root{--bg:#f6f5f2;--fg:#1d2026;--mu:#6b6f78;--li:#dddbd5;--ca:#fff;--ac:#c9400f;--chip:#ebe9e3}
@media (prefers-color-scheme:dark){:root{--bg:#191c21;--fg:#e9e8e4;--mu:#979ba4;--li:#30343b;--ca:#21252c;--ac:#ff8a5c;--chip:#2c3037}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,"PingFang SC",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--li);padding:14px 24px 10px}
.wrap{max-width:1320px;margin:auto}h1{font-size:21px;margin:0}.sub{color:var(--mu);font-size:13px;margin:2px 0 8px}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}button{font:inherit;color:inherit;cursor:pointer}
.chip{border:1px solid transparent;background:var(--chip);border-radius:999px;padding:2px 11px;font-size:13px}.chip[aria-pressed=true]{background:var(--fg);color:var(--bg)}
input[type=search]{font:inherit;color:inherit;background:var(--ca);border:1px solid var(--li);border-radius:8px;padding:3px 10px;width:170px}
main{padding:8px 24px 80px}h2{font-size:17px;margin:26px 0 2px}h3{font-size:13px;font-weight:500;color:var(--mu);margin:12px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;background:var(--ca);border:1px solid var(--li);border-radius:12px;padding:8px;text-align:center}
.open{display:block;width:100%;border:0;background:none;padding:0}.open img{width:100%;aspect-ratio:1;display:block}
.name{font-size:13px;margin-top:2px;line-height:1.3;min-height:2.6em;display:flex;align-items:center;justify-content:center}
.bars{display:flex;justify-content:center;gap:4px;margin-top:4px}.b{height:22px;min-width:26px;padding:0 3px;border-radius:5px;display:flex;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500}.b svg{display:block}.light{background:#ececee;color:#111}.dark{background:#2b2d33;color:#fff}
.heart{position:absolute;top:6px;right:6px;width:30px;height:30px;border:0;background:none;font-size:18px;line-height:1;color:var(--mu);border-radius:50%}.heart[aria-pressed=true]{color:var(--ac)}
.tag{position:absolute;top:8px;left:8px;font-size:11px;line-height:1.5;padding:0 5px;border-radius:4px;background:var(--chip);color:var(--mu)}.tag.rec{background:#f3e3b2;color:#6b4d00}.tag.fail{color:var(--mu)}
dialog{border:0;border-radius:16px;padding:0;background:var(--ca);color:var(--fg);width:min(860px,calc(100vw - 32px));max-height:calc(100vh - 32px)}dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{display:grid;grid-template-columns:320px 1fr;gap:20px;padding:20px}.dlg .big{width:100%;aspect-ratio:1;display:block}.dlg h2{margin:0 0 4px;font-size:20px}.dlg p{margin:0 0 6px}.mu{color:var(--mu);font-size:13px}.sizes{display:flex;align-items:flex-end;gap:12px;margin:10px 0}.sizes img{display:block}
.bigbars{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.bigbars .b{height:24px;justify-content:space-between;padding:0 8px;font-size:12px}.navs{display:flex;gap:6px;margin-top:12px}.btn{border:1px solid var(--li);background:var(--chip);border-radius:8px;padding:3px 11px}
.pulse img{animation:p 3.6s ease-in-out infinite}@keyframes p{0%,100%{filter:brightness(.88)}50%{filter:brightness(1.08)}}@media (prefers-reduced-motion:reduce){.pulse img{animation:none}}
#picked{margin-left:auto;font-size:13px}#copied{color:var(--mu);font-size:12px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
@media (max-width:720px){header{padding:12px 16px 8px;position:static}main{padding:8px 16px 60px}.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.dlg{grid-template-columns:1fr}.dlg .big{max-width:240px;margin:auto}input[type=search]{width:100%}#picked{margin-left:0}}
</style></head><body>

也有点像相机。", "img": "img/11-drum.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path fill-rule=\"evenodd\" d=\"M3 1H15A1.500 1.500 0 0 1 16.500 2.500V15.500A1.500 1.500 0 0 1 15 17H3A1.500 1.500 0 0 1 1.500 15.500V2.500A1.500 1.500 0 0 1 3 1ZM9 5A4.500 4.500 0 1 0 9.100 5Z\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><path fill-rule=\"evenodd\" d=\"M3 1H15A1.500 1.500 0 0 1 16.500 2.500V15.500A1.500 1.500 0 0 1 15 17H3A1.500 1.500 0 0 1 1.500 15.500V2.500A1.500 1.500 0 0 1 3 1ZM9 5A4.500 4.500 0 1 0 9.100 5Z\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path fill-rule=\"evenodd\" d=\"M3 1H15A1.500 1.500 0 0 1 16.500 2.500V15.500A1.500 1.500 0 0 1 15 17H3A1.500 1.500 0 0 1 1.500 15.500V2.500A1.500 1.500 0 0 1 3 1ZM9 5A4.500 4.500 0 1 0 9.100 5Z\"/><\/svg>", "status": "", "anim": false, "by": "Codex"}, {"id": "11-dial", "batch": 11, "group": "新点子", "name": "沙滩日晷", "idea": "一个扁圆盘上立一片三角，影子斜斜拖出去：你走开，时间和工作照常往前。", "risk": "容易落进计时工具的品类。", "img": "img/11-dial.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><ellipse cx=\"9\" cy=\"13.500\" rx=\"8\" ry=\"3.500\"/><path d=\"M7 11V2L12 11Z\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><ellipse cx=\"9\" cy=\"13.500\" rx=\"8\" ry=\"3.500\"/><path d=\"M7 11V2L12 11Z\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><ellipse cx=\"9\" cy=\"13.500\" rx=\"8\" ry=\"3.500\"/><path d=\"M7 11V2L12 11Z\"/><\/svg>", "status": "rec", "anim": false, "by": "Codex"}, {"id": "11-dog", "batch": 11, "group": "新点子", "name": "牧羊犬", "idea": "一只折耳狗头，方吻，耷拉的耳朵。替你看着一群 Agent，可靠又有性格。", "risk": "简化过头会像普通宠物头像；“牧羊”也和一个同类产品的主题撞了。画出来太生硬，看不出是狗。", "img": "img/11-dog.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M2 6H12L17 9V12H12V15H2Z\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><path d=\"M2 6H12L17 9V12H12V15H2Z\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M2 6H12L17 9V12H12V15H2Z\"/><\/svg>", "status": "fail", "anim": false, "by": "Codex"}, {"id": "11-crab", "batch": 11, "group": "新点子", "name": "寄居蟹", "idea": "一个方壳下面伸出翘起的腿。工作环境随身带着，里面的小家伙自己走。", "risk": "小尺寸可能像长脚的文件夹。画出来像一架雪橇。", "img": "img/11-crab.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><rect x=\"4\" y=\"1\" width=\"10\" height=\"9\" rx=\"2\" transform=\"rotate(-8 9 5.500)\"/><path d=\"M1 11L5 15H13L17 11\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><rect x=\"4\" y=\"1\" width=\"10\" height=\"9\" rx=\"2\" transform=\"rotate(-8 9 5.500)\"/><path d=\"M1 11L5 15H13L17 11\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><rect x=\"4\" y=\"1\" width=\"10\" height=\"9\" rx=\"2\" transform=\"rotate(-8 9 5.500)\"/><path d=\"M1 11L5 15H13L17 11\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg>", "status": "fail", "anim": false, "by": "Codex"}, {"id": "11-snap", "batch": 11, "group": "新点子", "name": "一记响指", "idea": "拇指和中指扣在一起，指尖弹出一道短楔。“有事叫你”浓缩成一个动作。", "risk": "手势很难画准，这版只是示意。画出来看不出是手。", "img": "img/11-snap.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M4 17V9Q4 7 6 7L11 5Q13 5 13 7L10 8.500H12Q14 8.500 14 10V17Z\"/><path d=\"M14 4L16 2.500M15 6.500L17.500 6\" stroke=\"currentColor\" stroke-width=\"1.300\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><path d=\"M4 17V9Q4 7 6 7L11 5Q13 5 13 7L10 8.500H12Q14 8.500 14 10V17Z\"/><path d=\"M14 4L16 2.500M15 6.500L17.500 6\" stroke=\"currentColor\" stroke-width=\"1.300\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M4 17V9Q4 7 6 7L11 5Q13 5 13 7L10 8.500H12Q14 8.500 14 10V17Z\"/><path d=\"M14 4L16 2.500M15 6.500L17.500 6\" stroke=\"currentColor\" stroke-width=\"1.300\"/><\/svg>", "status": "fail", "anim": false, "by": "Codex"}, {"id": "11-stretch", "batch": 11, "group": "新点子", "name": "伸个懒腰", "idea": "一个小人高举双臂。编码工具竟然鼓励你站起来走走，态度很大胆。", "risk": "容易被理解成运动或健康 App。", "img": "img/11-stretch.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><circle cx=\"9\" cy=\"3\" r=\"2\"/><rect x=\"7.500\" y=\"6\" width=\"3\" height=\"11\"/><path d=\"M2.500 2L7 7M15.500 2L11 7\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><circle cx=\"9\" cy=\"3\" r=\"2\"/><rect x=\"7.500\" y=\"6\" width=\"3\" height=\"11\"/><path d=\"M2.500 2L7 7M15.500 2L11 7\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><circle cx=\"9\" cy=\"3\" r=\"2\"/><rect x=\"7.500\" y=\"6\" width=\"3\" height=\"11\"/><path d=\"M2.500 2L7 7M15.500 2L11 7\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/><\/svg>", "status": "rec", "anim": false, "by": "Codex"}, {"id": "11-sew", "batch": 11, "group": "新点子", "name": "自动缝纫机", "idea": "一个倒 L 形机身加一块底板，线在下面自己走。像 Agent 一针一针把活缝完。", "risk": "可能被当成手作软件。画出来像字母 T。", "img": "img/11-sew.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M2 2H16V7H13V13H10V7H2Z\"/><rect x=\"1\" y=\"14.500\" width=\"16\" height=\"2.500\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><path d=\"M2 2H16V7H13V13H10V7H2Z\"/><rect x=\"1\" y=\"14.500\" width=\"16\" height=\"2.500\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M2 2H16V7H13V13H10V7H2Z\"/><rect x=\"1\" y=\"14.500\" width=\"16\" height=\"2.500\"/><\/svg>", "status": "fail", "anim": false, "by": "Codex"}, {"id": "11-wrench", "batch": 11, "group": "新点子", "name": "咬住任务", "idea": "一把开口扳手咬住一枚六角螺母。工具已经咬住了问题，你可以松手。", "risk": "维修工具的联想可能盖过软件。", "img": "img/11-wrench.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><g transform=\"rotate(-40 9 9)\"><path d=\"M7 8V17H11V8Q14 7 14 4Q14 2.500 13 1.500V5.500L9 7L5 5.500V1.500Q4 2.500 4 4Q4 7 7 8Z\"/><\/g><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><g transform=\"rotate(-40 9 9)\"><path d=\"M7 8V17H11V8Q14 7 14 4Q14 2.500 13 1.500V5.500L9 7L5 5.500V1.500Q4 2.500 4 4Q4 7 7 8Z\"/><\/g><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><g transform=\"rotate(-40 9 9)\" \"><path fill-rule=\"evenodd\" d=\"M1 15V9A8 7.5 0 0 1 17 9V15ZM4 7V8.5H8V7ZM10 7V8.5H14V7Z\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path fill-rule=\"evenodd\" d=\"M1 15V9A8 7.5 0 0 1 17 9V15ZM6 5.5A2 2 0 1 0 6.1 5.5ZM12 5.5A2 2 0 1 0 12.1 5.5Z\"/><\/svg>", "status": "fail", "anim": false, "by": "Claude"}, {"id": "9-p9", "batch": 9, "group": "探头往下做", "name": "探头·看着你", "idea": "瞳孔看向一侧，好像听到动静回头看你。这张最有“它在帮你盯着”的感觉。", "risk": "眼神一变，情绪也变，要小心不像在偷看。和方块边那张一样像幽灵。", "img": "img/9-p9.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path fill-rule=\"evenodd\" d=\"M1 15V9A8 7.5 0 0 1 17 9V15ZM6 5.5A2 2 0 1 0 6.1 5.5ZM12 5.5A2 2 0 1 0 12.1 5.5Z\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path fill-rule=\"evenodd\" d=\"M1 15V9A8 7.5 0 0 1 17 9V15ZM4 7V8.5H8V7ZM10 7V8.5H14V7Z\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path fill-rule=\"evenodd\" d=\"M1 15V9A8 7.5 0 0 1 17 9V15ZM6 5.5A2 2 0 1 0 6.1 5.5ZM12 5.5A2 2 0 1 0 12.1 5.5Z\"/><\/svg>", "status": "fail", "anim": false, "by": "Claude"}, {"id": "9-s5", "batch": 9, "group": "帆和小船往下做", "name": "两面帆·一高一低", "idea": "右帆更高，两张帆一前一后，更像一条真在走的船，字母 M 也还在。", "risk": "不对称之后，M 没那么一眼就是 M。", "img": "img/9-s5.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M1 16V5L8 16Z\"/><path d=\"M9.5 16L17 1V16Z\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><path d=\"M1 16V5L8 16Z\"/><path d=\"M9.5 16L17 1V16Z\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" c", "anim": false, "by": "Claude"}, {"id": "8-balloon", "batch": 8, "group": "它自己飞，线在你手里", "name": "气球", "idea": "气球想飞，绳子把它系在一块小重物上：自由，但不会丢。", "risk": "可能让人觉得是派对或儿童产品。", "img": "img/8-balloon.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"130 90 764 830\" fill=\"currentColor\"><ellipse cx=\"512\" cy=\"360\" rx=\"220\" ry=\"250\"/><path d=\"M512 610C570 700 460 760 512 830\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"44\"/><rect x=\"412\" y=\"810\" width=\"200\" height=\"90\" rx=\"12\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"130 90 764 830\" fill=\"currentColor\" opacity=\".35\"><ellipse cx=\"512\" cy=\"360\" rx=\"220\" ry=\"250\"/><path d=\"M512 610C570 700 460 760 512 830\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"44\"/><rect x=\"412\" y=\"810\" width=\"200\" height=\"90\" rx=\"12\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"130 90 764 830\" fill=\"currentColor\"><ellipse cx=\"512\" cy=\"360\" rx=\"220\" ry=\"250\"/><path d=\"M512 610C570 700 460 760 512 830\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"44\"/><rect x=\"412\" y=\"810\" width=\"200\" height=\"90\" rx=\"12\"/><\/svg>", "status": "", "anim": false, "by": "Claude"}, {"id": "8-integral", "batch": 8, "group": "数学、光、脉搏", "name": "积分号 ∫", "idea": "∫ 的意思是持续累积。它长得还像一根绷紧的绳子，学过理工的人一眼就认识。", "risk": "不懂的人只会看到一根弯线或字母 S；数学味重。", "img": "img/8-integral.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"170 130 680 760\" fill=\"currentColor\"><path d=\"M690 190Q560 130 530 280L490 740Q460 890 330 830\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"96\" stroke-linecap=\"round\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"170 130 680 760\" fill=\"currentColor\" opacity=\".35\"><path d=\"M690 190Q560 130 530 280L490 740Q460 890 330 83 8\" height=\"18\" viewBox=\"140 130 744 744\" fill=\"currentColor\" opacity=\".35\"><path fill-rule=\"evenodd\" d=\"M512 170L800 420V840H224V420ZM512 390A100 100 0 1 0 512.1 390Z\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"140 130 744 744\" fill=\"currentColor\"><path fill-rule=\"evenodd\" d=\"M512 170L800 420V840H224V420ZM512 390A100 100 0 1 0 512.1 390Z\"/><\/svg>", "status": "", "anim": false, "by": "Claude"}, {"id": "8-stars", "batch": 8, "group": "数学、光、脉搏", "name": "星座", "idea": "几颗星连成一组：很多 Agent 组成一个整体。水手也靠它认路。", "risk": "连线细，小尺寸容易散；星座类图形也不少。画出来更像股票走势图。", "img": "img/8-stars.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"120 170 790 790\" fill=\"currentColor\"><path d=\"M230 700L420 520L620 620L790 300\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"40\"/><circle cx=\"230\" cy=\"700\" r=\"70\"/><circle cx=\"420\" cy=\"520\" r=\"60\"/><circle cx=\"620\" cy=\"620\" r=\"60\"/><circle cx=\"790\" cy=\"300\" r=\"96\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"120 170 790 790\" fill=\"currentColor\" opacity=\".35\"><path d=\"M230 700L420 520L620 620L790 300\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"40\"/><circle cx=\"230\" cy=\"700\" r=\"70\"/><circle cx=\"420\" cy=\"520\" r=\"60\"/><circle cx=\"620\" cy=\"620\" r=\"60\"/><circle cx=\"790\" cy=\"300\" r=\"96\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"120 170 790 790\" fill=\"currentColor\"><path d=\"M230 700L420 520L620 620L790 300\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"40\"/><circle cx=\"230\" cy=\"700\" r=\"70\"/><circle cx=\"420\" cy=\"520\" r=\"60\"/><circle cx=\"620\" cy=\"620\" r=\"60\"/><circle cx=\"790\" cy=\"300\" r=\"96\"/><\/svg>", "status": "fail", "anim": false, "by": "Claude"}, {"id": "8-p2", "batch": 8, "group": "上一轮最有希望的变体", "name": "探头·只留眼睛", "idea": "头也  "batch": 8, "group": "上一轮最有希望的变体", "name": "探头·夜里", "idea": "深夜里只有一双黄眼睛亮着。你睡了，它还醒着。", "risk": "这版最酷，但也有点吓人。", "img": "img/8-p4.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><circle cx=\"5.5\" cy=\"7\" r=\"3.5\"/><circle cx=\"12.5\" cy=\"7\" r=\"3.5\"/><rect x=\"1\" y=\"13\" width=\"16\" height=\"2.5\" rx=\"1\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><rect x=\"2\" y=\"6\" width=\"7\" height=\"2\"/><rect x=\"9.5\" y=\"6\" width=\"7\" height=\"2\"/><rect x=\"1\" y=\"13\" width=\"16\" height=\"2.5\" rx=\"1\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><circle cx=\"5.5\" cy=\"7\" r=\"3.5\"/><circle cx=\"12.5\" cy=\"7\" r=\"3.5\"/><rect x=\"1\" y=\"13\" width=\"16\" height=\"2.5\" rx=\"1\"/><\/svg>", "status": "rec", "anim": false, "by": "Claude"}, {"id": "8-p5", "batch": 8, "group": "上一轮最有希望的变体", "name": "探头·眨眼", "idea": "一只眼睛眨一下，告诉你“这边我看着”。更亲切。", "risk": "这版更卡通。", "img": "img/8-p5.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><rect x=\"2\" y=\"6\" width=\"7\" height=\"2\"/><circle cx=\"12.5\" cy=\"7\" r=\"3.5\"/><rect x=\"1\" y=\"13\" width=\"16\" height=\"2.5\" rx=\"1\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><rect x=\"2\" y=\"6\" width=\"7\" height=\"2\"/><rect x=\"9.5\" y=\"6\" width=\"7\" height=\"2\"/><rect x=\"1\" y=\"13\" width=\"16\" height=\"2.5\" rx=\"1\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><rect x=\"2\" y=\"6\" width=\"7\" height=\"2\"/><circle cx=\"12.5\" cy=\"7\" r=\"3.5\"/><rect x=\"1\" y=\"13\" width=\"16\" height=\"2.5\" rx=\"1\"/><\ =\"none\" stroke=\"currentColor\" stroke-width=\"86\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 200 1024 800\" fill=\"currentColor\" opacity=\".35\"><path d=\"M-30 470Q230 250 512 450T1054 400\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"86\"/><path d=\"M-30 760Q250 590 512 750T1054 700\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"86\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 200 1024 800\" fill=\"currentColor\"><path d=\"M-30 470Q230 250 512 450T1054 400\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"86\"/><path d=\"M-30 760Q250 590 512 750T1054 700\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"86\"/><\/svg>", "status": "rec", "anim": false, "by": "Claude"}, {"id": "7-chair", "batch": 7, "group": "从产品真正在做的事出发", "name": "空椅亮灯", "idea": "椅子空着，灯还亮着。你走开了，活还在干。", "risk": "可能被当成办公或在线状态工具。渲染出来还很像字母 h。", "img": "img/7-chair.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><rect x=\"4\" y=\"4\" width=\"2\" height=\"13\"/><rect x=\"4\" y=\"10\" width=\"9\" height=\"2\"/><rect x=\"11\" y=\"10\" width=\"2\" height=\"7\"/><rect x=\"11\" y=\"2\" width=\"4\" height=\"4\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><rect x=\"4\" y=\"4\" width=\"2\" height=\"13\"/><rect x=\"4\" y=\"10\" width=\"9\" height=\"2\"/><rect x=\"11\" y=\"10\" width=\"2\" height=\"7\"/><rect x=\"11\" y=\"2\" width=\"4\" height=\"4\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><rect x=\"4\" y=\"4\" width=\"2\" height=\"13\"/><rect x=\"4\" y=\"10\" width=\"9\" height=\"2\"/><rect x=\"11\" y=\"10\" width=\"2\" height=\"7\"/><rect x=\"11\" y=\"2\" width=\"4\" height=\"4\"/><\/svg>", "status": "fail", "anim": false, "by": "Codex"}, {"id": "7-toast", "batch": 7, "group": "从产品真正在做的事出发", "name": "烤好再叫", "idea": "交进去，自己做，好了“叮”一声弹出来。把异步工作讲得最轻松。", "risk": "食物联想很强，可能不够严肃。", "img": "img/7-toast.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><rect x=\"6\" y=\"1\" width=\"6\" height=\"6\" rx=\"1\"/><rect x=\"2\" y=\"8\" width=\"14\" height=\"9\" rx=\"3\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><rect x=\"6\" y=\"1\" width=\"6\" height=\"6\" rx=\"1\"/><rect x=\"2\" y=\"8\" width=\"14\" height=\"9\" rx=\"3\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><rect x=\"6\" y=\"1\" width=\"6\" height=\"6\" rx=\"1\"/><rect x=\"2\" y=\"8\" width=\"14\" height=\"9\" rx=\"3\"/><\/svg>", "status": "rec", "anim": false, "by": "Codex"}, {"id": "7-mail", "batch": 7, "group": "从产品真正在做的事出发", "name": "举旗信箱", "idea": "平时旗子放下，有事要你处理，旗子就竖起来。状态本身就是图形。", "risk": "这种信箱主要流行在北美，别处不一定熟悉。", "img": "img/7-mail.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M1 12V7A4 4 0 0 1 5 3H13V12Z\"/><rect x=\"6\" y=\"12\" width=\"3\" height=\"5\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><path d=\"M1 12V7A4 4 0 0 1 5 3H13V12Z\"/><rect x=\"6\" y=\"12\" width=\"3\" height=\"5\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M1 12V7A4 4 0 0 1 5 3H13V12Z\"/><rect x=\"6\" y=\"12\" width=\"3\" height=\"5\"/><rect x=\"14\" y=\"1\" width=\"1.5\" height=\"9\"/><rect x=\"15.5\" y=\"1\" width=\"2.5\" height=\"3\"/><\/svg>", "status": "rec", "anim": false, "by": "Codex"}, {"id": "7-peek", "batch": 7, "group": "从产品真正在做的事出发", "name": "探头", "idea": "一双眼睛从水面探出来，替你盯着。托盘里眼睛睁着就是平时，闭上就是断线。", "risk": "偏可爱；也可能被认成河马或海豹，不过这不算坏事。", "img": "img/7-peek.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><circle cx=\"5.5\" cy=\"7\" r=\"3.5\"/><circle cx=\"12.5\" cy=\"7\" r=\"3.5\"/><rect x=\"1\" y=\"13\" width=\"16\" height=\"2.5\" rx=\"1\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><rect x=\"2\" y=\"6\" width=\"7\" height=\"2\"/><rect x=\"9.5\" y=\"6\" width=\"7\" height=\"2\"/><rect x=\"1\" y=\"13\" width=\"16\" height=\"2.5\" rx=\"1\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><circle cx=\"5.5\" cy=\"7\" r=\"3.5\"/><circle cx=\"12.5\" cy=\"7\" r=\"3.5\"/><rect x=\"1\" y=\"13\" width=\"16\" height=\"2.5\" rx=\"1\"/><\/svg>", "status": "rec", "anim": false, "by": "Claude"}, {"id": "7-door", "batch": 7, "group": "从产品真正在做的事出发", "name": "门缝的光", "idea": "你出去了，门里的灯还亮着。安静，有点故事。", "risk": "可能被读成“退出”。", "img": "img/7-door.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><rect x=\"7\" y=\"2\" width=\"8\" height=\"14\"/><path d=\"M6 2L3 4V17L6 16Z\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><rect x=\"7\" y=\"2\" width=\"8\" height=\"14\"/><path d=\"M6 2L3 4V17L6 16Z\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><rect x=\"7\" y=\"2\" width=\"8\" height=\"14\"/><path d=\"M6 2L3 4V17L6 16Z\"/><\/svg>", "status": "", "anim": false, "by": "Claude"}, {"id": "7-fly", "batch": 7, "group": "从产品真正在做的事出发", "name": "偏心飞轮", "idea": "一个圆盘，挖掉一个偏心的小圆。静止的图形也有一直在转的势能。", "risk": "可能被看成唱片或摄像头。", "img": "img/7-fly.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path fill-rule=\"evenodd\" d=\"M9 1A8 8 0 1 1 8.9 1ZM11.5 4A2.5 2.5 0 1 0 11.6 4Z\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><path fill-rule=\"evenodd\" d=\"M9 1A8 8 0 1 1 8.9 1ZM11.5 4A2.5 2.5 0 1 0 11.6 4Z\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path fill-rule=\"evenodd\" d=\"M9 1A8 8 0 1 1 8.9 1ZM11.5 4A2.5 2.5 0 1 0 11.6 4Z\"/><\/svg>", "status": "", "anim": false, "by": "Codex"}, {"id": "7-fit", "batch": 7, "group": "从产品真正在做的事出发", "name": "差最后一块", "idea": "活都干完了，只留最后一块给你按下去。", "risk": "也可能暗示产品总差一步。画出来更像文件夹。", "img": "img/7-fit.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M1 6H10V10H17V16H1Z\"/><rect x=\"12\" y=\"2\" width=\"5\" height=\"5\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><path d=\"M1 6H10V10H17V16H1Z\"/><rect x=\"12\" y=\"2\" width=\"5\" height=\"5\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M1 6H10V10H17V16H1Z\"/><rect x=\"12\" y=\"2\" width=\"5\" height=\"5\"/><\/svg>", "status": "fail", "anim": false, "by": "Codex"}, {"id": "7-cont", "batch": 7, "group": "从产品真正在做的事出发", "name": "未完待续", "idea": "两个点接一条拉长的胶囊：还在往前走。", "risk": "容易让人想到“正在输入”。", "img": "img/7-cont.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><circle cx=\"3\" cy=\"9\" r=\"2\"/><circle cx=\"8\" cy=\"9\" r=\"2\"/><rect x=\"11\" y=\"7\" width=\"7\" height=\"4\" rx=\"2\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><circle cx=\"3\" cy=\"9\" r=\"2\"/><circle cx=\"8\" cy=\"9\" r=\"2\"/><rect x=\"11\" y=\"7\" width=\"7\" height=\"4\" rx=\"2\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><circle cx=\"3\" cy=\"9\" r=\"2\"/><circle cx=\"8\" cy=\"9\" r=\"2\"/><rect x=\"11\" y=\"7\" width=\"7\" height=\"4\" rx=\"2\"/><\/svg>", "status": "", "anim": false, "by": "Codex"}, {"id": "7-mu", "batch": 7, "group": "从字符出发", "name": "m_", "idea": "首字母加一个光标，正在等你输入的样子。全世界开发者都读得懂，一眼是终端工具但没有用 >。", "risk": "字母图标不少，要靠字形把它做得专属。", "img": "img/7-mu.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><text x=\"9\" y=\"13.5\" font-family=\"Menlo\" font-weight=\"700\" font-size=\"13\" text-anchor=\"middle\" letter-spacing=\"-1\">m_<\/text><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><text x=\"9\" y=\"13.5\" font-family=\"Menlo\" font-weight=\"700\" font-size=\"13\" text-anchor=\"middle\" letter-spacing=\"-1\">m_<\/text><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><text x=\"9\" y=\"13.5\" font-family=\"Menlo\" font-weight=\"700\" font-size=\"13\" text-anchor=\"middle\" letter-spacing=\"-1\">m_<\/text><\/svg>", "status": "", "anim": false, "by": "Claude"}, {"id": "7-paren", "batch": 7, "group": "从字符出发", "name": "括号托管", "idea": "一对圆括号护住一颗悬着的小方块：把任务放心交进去。", "risk": "括号类标志不少，要靠比例做出特别。", "img": "img/7-paren.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M6 2Q2 9 6 16\"/><path d=\"M12 2Q16 9 12 16\"/><\/g><rect x=\"7\" y=\"6\" width=\"4\" height=\"4\" transform=\"rotate(45 9 8)\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M6 2Q2 9 6 16\"/><path d=\"M12 2Q16 9 12 16\"/><\/g><rect x=\"7\" y=\"6\" width=\"4\" height=\"4\" transform=\"rotate(45 9 8)\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M6 2Q2 9 6 16\"/><path d=\"M12 2Q16 9 12 16\"/><\/g><rect x=\"7\" y=\"6\" width=\"4\" height=\"4\" transform=\"rotate(45 9 8)\"/><\/svg>", "status": "", "anim": false, "by": "Codex"}, {"id": "7-cur", "batch": 7, "group": "从字符出发", "name": "光标帆船", "idea": "终端的方块光标竖起来就是帆，下面一个船身。船和终端都有了，又没有 >。", "risk": "小，但要靠闪烁才看得出光标的意思。", "img": "img/7-cur.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><rect x=\"7\" y=\"1\" width=\"5\" height=\"9\"/><path d=\"M1 11H17Q16 17 12 17H6Q2 17 1 11Z\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><rect x=\"7\" y=\"1\" width=\"5\" height=\"9\"/><path d=\"M1 11H17Q16 17 12 17H6Q2 17 1 11Z\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><rect x=\"7\" y=\"1\" width=\"5\" height=\"9\"/><path d=\"M1 11H17Q16 17 12 17H6Q2 17 1 11Z\"/><\/svg>", "status": "", "anim": false, "by": "Claude"}, {"id": "7-pane", "batch": 7, "group": "从字符出发", "name": "窗格成船", "idea": "四块分屏拼出一条船：两块是帆，两块是船身。工作台本身就是这条船。", "risk": "细节多，小尺寸要靠颜色撑。", "img": "img/7-pane.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M8.5 1V8.5H1A7.5 7.5 0 0 1 8.5 1Z\"/><path d=\"M9.5 1A7.5 7.5 0 0 1 17 8.5H9.5Z\"/><path d=\"M1 9.5H17A7.5 7.5 0 0 1 9.5 17H8.5A7.5 7.5 0 0 1 1 9.5Z\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><path d=\"M8.5 1V8.5H1A7.5 7.5 0 0 1 8.5 1Z\"/><path d=\"M9.5 1A7.5 7.5 0 0 1 17 8.5H9.5Z\"/><path d=\"M1 9.5H17A7.5 7.5 0 0 1 9.5 17H8.5A7.5 7.5 0 0 1 1 9.5Z\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M8.5 1V8.5H1A7.5 7.5 0 0 1 8.5 1Z\"/><path d=\"M9.5 1A7.5 7.5 0 0 1 17 8.5H9.5Z\"/><path d=\"M1 9.5H17A7.5 7.5 0 0 1 9.5 17H8.5A7.5 7.5 0 0 1 1 9.5Z\"/><\/svg>", "status": "", "anim": false, "by": "Claude"}, {"id": "7-kflag", "batch": 7, "group": "从国际通用的符号出发", "name": "K 旗", "idea": "海事信号旗 K，黄蓝各半，意思是“我想和你通话”：正好是“有事叫你”。全世界船员都认这面旗。", "risk": "不懂船的人只看到一块黄蓝色；托盘也像“对比度”图标。", "img": "img/7-kflag.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><rect x=\"2.75\" y=\"3.75\" width=\"12.5\" height=\"10.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"3\" y=\"4\" width=\"6\" height=\"10\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><rect x=\"2.75\" y=\"3.75\" width=\"12.5\" height=\"10.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"3\" y=\"4\" width=\"6\" height=\"10\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><rect x=\"2.75\" y=\"3.75\" width=\"12.5\" height=\"10.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"3\" y=\"4\" width=\"6\" height=\"10\"/><\/svg>", "status": "", "anim": false, "by": "Claude"}, {"id": "7-mflag", "batch": 7, "group": "从国际通用的符号出发", "name": "M 旗", "idea": "信号旗 M，蓝底白色斜十字，意思是“本船已停，不再航行”，也是 Mooring 的首字母。", "risk": "大大的 X 很容易被读成“关闭”或“错误”；也像苏格兰旗。这条可能不行，但含义太巧，放出来给你看。", "img": "img/7-mflag.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M2 2H16V16H2Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><path d=\"M3 3L15 15M15 3L3 15\" stroke=\"currentColor\" stroke-width=\"2.2\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><path d=\"M2 2H16V16H2Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><path d=\"M3 3L15 15M15 3L3 15\" stroke=\"currentColor\" stroke-width=\"2.2\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M2 2H16V16H2Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><path d=\"M3 3L15 15M15 3L3 15\" stroke=\"currentColor\" stroke-width=\"2.2\"/><\/svg>", "status": "", "anim": false, "by": "Claude"}, {"id": "7-sails", "batch": 7, "group": "从国际通用的符号出发", "name": "两面帆", "idea": "两张三角帆并排，中间的缝正好是 M。字母和船一笔到位，不用解释。", "risk": "帆船是常见符号，要靠比例和颜色记住。", "img": "img/7-sails.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M1 16V2L8.5 16Z\"/><path d=\"M9.5 16L17 2V16Z\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><path d=\"M1 16V2L8.5 16Z\"/><path d=\"M9.5 16L17 2V16Z\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M1 16V2L8.5 16Z\"/><path d=\"M9.5 16L17 2V16Z\"/  d=\"M717.3 247.8L726.6 794.1L858.0 789.8L836.2 243.9Z\"/><\/svg>", "status": "fail", "anim": false, "by": "Claude"}, {"id": "3-face", "batch": 3, "group": "往同类的空白处发散", "name": "字符脸", "idea": "产品自己的字符脸当标志，右边的朱红块是光标。托盘会变表情：平时 -_-，有事睁眼 □_□，断线 x_x。取到的 7 个托盘都没有表情，这是最不一样的地方。", "risk": "太简单，大图可能显得空；也可能被当成颜文字玩具。", "img": "img/3-face.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><rect x=\"1\" y=\"6\" width=\"6\" height=\"2\"/><rect x=\"11\" y=\"6\" width=\"6\" height=\"2\"/><rect x=\"6\" y=\"12\" width=\"6\" height=\"2\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M2 4H3V5H4V6H5V5H6V4H7V5H6V6H5V7H6V8H7V9H6V8H5V7H4V8H3V9H2V8H3V7H4V6H3V5H2ZM11 4H12V5H13V6H14V5H15V4H16V5H15V6H14V7H15V8H16V9H15V8H14V7H13V8H12V9H11V8H12V7H13V6H12V5H11Z\"/><rect x=\"6\" y=\"12\" width=\"6\" height=\"2\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path fill-rule=\"evenodd\" d=\"M2 4H7V9H2ZM4 6V7H5V6ZM11 4H16V9H11ZM13 6V7H14V6Z\"/><rect x=\"6\" y=\"12\" width=\"6\" height=\"2\"/><\/svg>", "status": "", "anim": false, "by": "Claude"}, {"id": "3-marina", "batch": 3, "group": "往同类的空白处发散", "name": "码头俯瞰", "idea": "从上往下看码头：每条船是一个会话，红的那条在等你。它同时也是一张会话列表。最贴合“多 Agent 工作台”，同类里没人这样画。", "risk": "托盘容易像带箭头的列表。", "img": "img/3-marina.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><rect x=\"1\" y=\"1\" width=\"2\" height=\"16\"/><path d=\"M5 2H13L17 3.5L13 5H5ZM5 7.5H13L17 9L13 10.5H5ZM5 13H13L17 14.5L13 16H5Z\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><rect x=\"1\" y=\"1\" width=\"2\" height=\"16\"/><path d=\"M5 2H13L17 3.5L13 5H5ZM5 7.5H13L17 9L13 10.5H5ZM5 13H13L17 14.5L13 16H5Z\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><rect x=\"1\" y=\"1\" width=\"2\" height=\"16\"/><path d=\"M5 2H13L17 3.5L13 5H5ZM5 7.5H13L17 9L13 10.5H5ZM5 13H13L17 14.5L13 16H5Z\"/><\/svg>", "status": "", "anim": false, "by": "Claude"}, {"id": "3-origami", "batch": 3, "group": "往同类的空白处发散", "name": "折纸船", "idea": "一只纸船，轻，也好认。托盘只要两个三角形，18pt 最干净。几何感强，和黑底白标的同类差别很大。", "risk": "跟产品关系较弱；纸船给人的印象偏“放走”，不是“系住”。", "img": "img/3-origami.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M9 1L13 9H5Z\"/><path d=\"M1 10H17L13 16H5Z\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><path d=\"M9 1L13 9H5Z\"/><path d=\"M1 10H17L13 16H5Z\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M9 1L13 9H5Z\"/><path d=\"M1 10H17L13 16H5Z\"/><\/svg>", "status": "", "anim": false, "by": "Claude"}, {"id": "3-ink", "batch": 3, "group": "往同类的空白处发散", "name": "水墨孤舟", "idea": "远山、一叶小舟、一枚朱印。接着现在的水墨走，开发工具里几乎没人这样做。最有个性、最安静，也留住了你现有的感觉。", "risk": "小尺寸远山会消失，只剩船；托盘要靠另一个简化形状。", "img": "img/3-ink.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M5 9H13L11.5 6.5H6.5Z\"/><path d=\"M1 10H17L14 15H4Z\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><path d=\"M5 9H13L11.5 6.5H6.5Z\"/><path d=\"M1 10H17L14 15H4Z\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M5 9H13L11.5 6.5H6.5Z\"/><path d=\"M1 10H17L14 15H4Z\"/><\/svg>", "status": "", "anim": false, "by": "Claude"}, {"id": "3-seal", "batch": 3, "group": "往同类的空白处发散", "name": "泊字印章", "idea": "一枚红印，刻一个“泊”。不用解释就有文化辨识度。在一排图标里极其醒目。", "risk": "英文用户读不出含义；托盘 18pt 字会糊；字现在用的是宋体占位，真要用得专门写或刻。", "img": "img/3-seal.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><defs><mask id=\"t\"><rect width=\"18\" height=\"18\" fill=\"#fff\"/><text x=\"9\" y=\"14.5\" font-family=\"Songti SC\" font-weight=\"900\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#000\">泊<\/text><\/mask><\/defs><rect x=\"1\" y=\"1\" width=\"16\" height=\"16\" rx=\"2\" mask=\"url(#t)\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><defs><mask id=\"t\"><rect width=\"18\" height=\"18\" fill=\"#fff\"/><text x=\"9\" y=\"14.5\" font-family=\"Songti SC\" font-weight=\"900\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#000\">泊<\/text><\/mask><\/defs><rect x=\"1\" y=\"1\" width=\"16\" height=\"16\" rx=\"2\" mask=\"url(#t)\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><defs><mask id=\"t\"><rect width=\"18\" height=\"18\" fill=\"#fff\"/><text x=\"9\" y=\"14.5\" font-family=\"Songti SC\" font-weight=\"900\" font-size=\"14.5\" text-anchor=\"middle\" fill=\"#000\">泊<\/text><\/mask><\/defs><rect x=\"1\" y=\"1\" width=\"16\" height=\"16\" rx=\"2\" mask=\"url(#t)\"/><\/svg>", "status": "", "anim": false, "by": "Claude"}, {"id": "3-gull", "batch": 3, "group": "往同类的空白处发散", "name": "海鸥守桩", "idea": "你走开了，海鸥替你守着。一个有性格的角色，同类里 Happy、Kimi、Grok 也走这条路，但海鸥没人用。最讨喜，以后还能给角色做表情和动画。", "risk": "最卡通，严肃用户可能不喜欢。", "img": "img/3-gull.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M9 1H12V2.5H15V4H12V6L11 8.5H5L1 6H7L9 5Z\"/><rect x=\"5\" y=\"10\" width=\"6\" height=\"7\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><path d=\"M9 1H12V2.5H15V4H12V6L11 8.5H5L1 6H7L9 5Z\"/><rect x=\"5\" y=\"10\" width=\"6\" height=\"7\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M9 1H12V2.5H15V4H12V6L11 8.5H5L1 6H7L9 5Z\"/><rect x=\"5\" y=\"10\" width=\"6\" height=\"7\"/><\/svg>", "status": "", "anim": false, "by": "Claude"}, {"id": "3-light", "batch": 3, "group": "往同类的空白处发散", "name": "灯塔", "idea": "你不在，灯还亮着。托盘的光束就是状态：连不上后台，光束消失。含义清楚，状态表达最自然。", "risk": "灯塔是常见符号，也偏“指路”而不是“看护”。", "img": "img/3-light.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M6 1H10L11 3V6H5V3ZM6 7H10L12 17H4Z\"/><rect x=\"12\" y=\"1\" width=\"5\" height=\"1.5\"/><rect x=\"12\" y=\"4\" width=\"5\" height=\"1.5\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M6 1H10L11 3V6H5V3ZM6 7H10L12 17H4Z\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M6 1H10L11 3V6H5V3ZM6 7H10L12 17H4Z\"/><rect x=\"12\" y=\"1\" width=\"5\" height=\"1.5\"/><rect x=\"12\" y=\"4\" width=\"5\" height=\"1.5\"/><\/svg>", "status": "", "anim": false, "by": "Claude"}, {"id": "2-rope", "batch": 2, "group": "第一次从头重画", "name": "绳眼", "idea": "一根真的缆绳套在朱红的桩上，绳子跑出画面，像绷紧着。形状本身还是一个 >，所以同时说了“系泊”和“终端”。托盘：绳眼加方桩，连不上后台时桩消失。", "risk": "最抽象，要靠名字才知道是“系泊”；绳纹在 32pt 以下会糊成一条米色带；托盘沿用了上一轮 F 的折角形状，只放大了一点，不是全新的。", "img": "img/2-rope.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M1 1H9L17 9L9 17H1V15H8L14 9L8 3H1Z\"/><rect x=\"6\" y=\"7\" width=\"4\" height=\"4\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M1 1H9L17 9L9 17H1V15H8L14 9L8 3H1Z\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M1 1H9L17 9L9 17H1V15H8L14 9L8 3H1Z\"/><rect x=\"6\" y=\"7\" width=\"4\" height=\"4\"/><\/svg>", "status": "", "anim": false, "by": "Claude"}, {"id": "2-boat", "batch": 2, "group": "第一次从头重画", "name": "夜泊", "idea": "傍晚的小船系在桩上，驾驶舱亮着 >_。讲的正是这个产品：你走开了，船还系在那里，灯还亮着，里面还在跑。托盘：一条小船，连不上后台时整体变淡。", "risk": "最有故事，但最童话，和其他开发工具放一起风格最活泼；托盘小到 18pt 只剩方块加船底，更像印章，这一版还没画好。", "img": "img/2-boat.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path fill-rule=\"evenodd\" d=\"M6 3H13V9H6ZM8 5V7H11V5Z\"/><path d=\"M1 10H17L15 14H3Z\"/><rect x=\"2\" y=\"16\" width=\"14\" height=\"1\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><path fill-rule=\"evenodd\" d=\"M6 3H13V9H6ZM8 5V7H11V5Z\"/><path d=\"M1 10H17L15 14H3Z\"/><rect x=\"2\" y=\"16\" width=\"14\" height=\"1\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path fill-rule=\"evenodd\" d=\"M6 3H13V9H6ZM8 5V7H11V5Z\"/><path d=\"M1 10H17L15 14H3Z\"/><rect x=\"2\" y=\"16\" width=\"14\" height=\"1\"/><\/svg>", "status": "", "anim": false, "by": "Claude"}, {"id": "2-buoy", "batch": 2, "group": "第一次从头重画", "name": "浮标", "idea": "水面上一个带系缆环的红色系泊浮标。三个里颜色最跳，在 Dock 里最好找。托盘：环、球和水线，连不上后台时整体变淡。", "risk": "和“终端”没有关系；大图可能先被看成圣诞球或鱼漂；托盘像叠起来的瓶子，这一版也没画好。", "img": "img/2-buoy.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path fill-rule=\"evenodd\" d=\"M7 0H11V3H10V4H12.5L14 6V8H4V6L5.5 4H8V3H7ZM8 1V2H10V1Z\"/><path d=\"M4 10H14V11L13 13H5L4 11Z\"/><rect x=\"1\" y=\"15\" width=\"16\" height=\"2\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\" opacity=\".35\"><path fill-rule=\"evenodd\" d=\"M7 0H11V3H10V4H12.5L14 6V8H4V6L5.5 4H8V3H7ZM8 1V2H10V1Z\"/><path d=\"M4 10H14V11L13 13H5L4 11Z\"/><rect x=\"1\" y=\"15\" width=\"16\" height=\"2\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path fill-rule=\"evenodd\" d=\"M7 0H11V3H10V4H12.5L14 6V8H4V6L5.5 4H8V3H7ZM8 1V2H10V1Z\"/><path d=\"M4 10H14V11L13 13H5L4 11Z\"/><rect x=\"1\" y=\"15\" width=\"16\" height=\"2\"/><\/svg>", "status": "", "anim": false, "by": "Claude"}, {"id": "1-current", "batch": 1, "group": "最早的三个方向和 Codex 的两个", "name": "现在的图标", "idea": "现在的水墨缺口环。系统会把它缩小，再套一圈浅色底板。这里的托盘是第 1 轮“留墨环”的单色版：一个 C 形环加一个小块，连不上后台时小块消失。", "risk": "现在实际的托盘是文字 K，改名后对不上。这个托盘版当时被 Claude 否掉，因为像“加载中”的转圈，不是用户否的。", "img": "img/1-current.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M15.56 8.31A6.6 6.6 0 1 1 9.46 2.42\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><rect x=\"11.98\" y=\"3.15\" width=\"3.2\" height=\"2.2\" rx=\".5\" transform=\"rotate(-46 13.58 4.25)\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M15.56 8.31A6.6 6.6 0 1 1 9.46 2.42\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M15.56 8.31A6.6 6.6 0 1 1 9.46 2.42\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><rect x=\"11.98\" y=\"3.15\" width=\"3.2\" height=\"2.2\" rx=\".5\" transform=\"rotate(-46 13.58 4.25)\"/><\/svg>", "status": "", "anim": false, "by": "Claude"}, {"id": "1-F", "batch": 1, "group": "最早的三个方向和 Codex 的两个", "name": "折角绕桩", "idea": "和 Codex 商量后的结果：折角的 > 加方桩。", "risk": "后来发现 > 是同类里最挤的做法，收回推荐。", "img": "img/1-F.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M2 2H9L16 9L9 16H2V14H8L13 9L8 4H2Z\"/><rect x=\"7\" y=\"8\" width=\"2\" height=\"2\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M2 2H9L15 8H12L8 4H2ZM12 10H15L9 16H2V14H8Z\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M2 2H9L16 9L9 16H2V14H8L13 9L8 4H2Z\"/><rect x=\"7\" y=\"8\" width=\"2\" height=\"2\"/><\/svg>", "status": "", "anim": false, "by": "Claude"}, {"id": "1-A", "batch": 1, "group": "最早的三个方向和 Codex 的两个", "name": "绕桩", "idea": "绳眼套在桩上，俯视是一个 >。", "risk": "像一只眼睛；断线不够醒目。", "img": "img/1-A.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M2.4 2.4L12.5 4.7A4.4 4.4 0 0 1 12.5 13.3L2.4 15.6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><circle cx=\"11.5\" cy=\"9\" r=\"1.75\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M2.4 2.4L12.5 4.7A4.4 4.4 0 0 1 12.5 13.3L2.4 15.6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M2.4 2.4L12.5 4.7A4.4 4.4 0 0 1 12.5 13.3L2.4 15.6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><circle cx=\"11.5\" cy=\"9\" r=\"1.75\"/><\/svg>", "status": "", "anim": false, "by": "Claude"}, {"id": "1-C", "batch": 1, "group": "最早的三个方向和 Codex 的两个", "name": "一笔 M", "idea": "一笔写成 M，右脚落在浮标上。", "risk": "脚下的点读起来像感叹号，平时也像在报警。", "img": "img/1-C.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M2.6 15.2V3L8.2 9.6L13.8 3V9.6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"13.8\" cy=\"13.6\" r=\"1.9\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M2.6 15.2V3L8.2 9.6L13.8 3V9.6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M2.6 15.2V3L8.2 9.6L13.8 3V9.6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"13.8\" cy=\"13.6\" r=\"1.9\"/><\/svg>", "status": "fail", "anim": false, "by": "Claude"}, {"id": "1-D", "batch": 1, "group": "最早的三个方向和 Codex 的两个", "name": "系缆桩", "idea": "Codex 的第一个方向：一个立住的桩。", "risk": "渲染出来像工字钢和文本光标。", "img": "img/1-D.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M2 4H16V6H13L10 9V13H14V15H4V13H8V9L5 6H2Z\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M2 4H16V6H13L10 9V10H8V9L5 6H2Z\"/><path d=\"M4 13H14V15H4Z\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M2 4H16V6H13L10 9V13H14V15H4V13H8V9L5 6H2Z\"/><\/svg>", "status": "fail", "anim": false, "by": "Codex"}, {"id": "1-E", "batch": 1, "group": "最早的三个方向和 Codex 的两个", "name": "双桩横缆", "idea": "Codex 的第二个方向：两根桩一根横缆。", "risk": "读起来像字母 HT。", "img": "img/1-E.png", "on": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M1 3H8V5H6V10H12V8H10V6H17V8H15V15H12V12H6V15H3V5H1Z\"/><\/svg>", "off": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M1 3H8V5H6V15H3V5H1Z\"/><path d=\"M10 6H17V8H15V15H12V8H10Z\"/><\/svg>", "need": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"currentColor\"><path d=\"M1 3H8V5H6V10H12V8H10V6H17V8H15V15H12V12H6V15H3V5H1Z\"/><\/svg>", "status": "fail", "anim": false, "by": "Codex"}], "batches": {"13": "第 13 轮：Codex 亲手画", "12": "第 12 轮：换画法", "11": "第 11 轮：新点子", "10": "第 10 轮：细化", "9": "第 9 轮：继续发展", "8": "第 8 轮：创意墙二", "7": "第 7 轮：创意墙一", "6": "第 6 轮：信号黄", "5": "第 5 轮：一个形状", "4": "第 4 轮：废稿", "3": "第 3 轮：七个发散", "2": "第 2 轮：重画", "1": "第 1 轮：最早"}}</script>
<script>
const {items,batches}=JSON.parse(document.getElementById('data').textContent);
const load=()=>{try{return new Set(JSON.parse(localStorage.getItem('mooring-icon-likes')||'[]'))}catch(e){return new Set()}};
const likes=load();const save=()=>{try{localStorage.setItem('mooring-icon-likes',JSON.stringify([...likes]))}catch(e){}};
let view='all',batch='all',q='',shown=[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const VIEWS=[['all','全部'],['liked','我喜欢的'],['rec','Claude 看好'],['codex','Codex 的点子'],['fail','翻车的'],['ring','圆环加一点']];
const RING=['1-current','4-bay','13-cradle','7-fly','9-br3'];
function chips(){
  document.getElementById('views').innerHTML=VIEWS.map(([k,l])=>`<button class="chip" data-v="${k}" aria-pressed="${view===k}">${l}</button>`).join('')+'<input type="search" id="q" placeholder="搜名字或想法" aria-label="搜索" value="'+esc(q)+'"><span id="picked"></span>';
  const ks=Object.keys(batches).sort((a,b)=>b-a);
  document.getElementById('batches').innerHTML=`<button class="chip" data-b="all" aria-pressed="${batch==='all'}">所有轮次</button>`+ks.map(k=>`<button class="chip" data-b="${k}" aria-pressed="${batch===k}">${batches[k]}</button>`).join('');
  document.getElementById('q').addEventListener('input',e=>{q=e.target.value;render()});
}
function match(i){
  if(batch!=='all'&&String(i.batch)!==batch)return false;
  if(view==='liked'&&!likes.has(i.id))return false;if(view==='rec'&&i.status!=='rec')return false;if(view==='fail'&&i.status!=='fail')return false;if(view==='codex'&&i.by!=='Codex')return false;if(view==='ring'&&!RING.includes(i.id))return false;
  return !q||(i.name+i.idea+i.risk).toLowerCase().includes(q.toLowerCase());
}
const card=i=>`<div class="card ${i.status}${i.anim?' pulse':''}">${i.status==='rec'?'<span class="tag rec">看好</span>':i.status==='fail'?'<span class="tag fail">翻车</span>':''}<button class="heart" data-l="${i.id}" aria-pressed="${likes.has(i.id)}" aria-label="喜欢 ${esc(i.name)}">${likes.has(i.id)?'♥':'♡'}</button><button class="open" data-o="${i.id}" aria-label="放大 ${esc(i.name)}"><img loading="lazy" src="${i.img}" alt="${esc(i.name)}"><div class="name">${esc(i.name)}</div></button>${i.on?`<div class="bars"><div class="b light">${i.on}</div><div class="b dark">${i.on}</div></div>`:''}${view==='ring'?`<div class="sizes" style="justify-content:center">${[64,32,16].map(n=>`<img src="${i.img}" width="${n}" height="${n}" alt="">`).join('')}</div><div class="bars"><div class="b light">${i.need}3</div><div class="b dark">${i.off||i.on}</div></div><p class="mu" style="margin:6px 0 0;text-align:left">${esc(i.idea)}</p>`:''}</div>`;
function render(){
  shown=items.filter(match);let h='';
  if(view==='ring'){shown=RING.map(id=>shown.find(i=>i.id===id)).filter(Boolean);h='<h2>圆环或弧线，加一个点</h2><div class="grid wide">'+shown.map(card).join('')+'</div>'}else{
  const ks=[...new Set(shown.map(i=>i.batch))].sort((a,b)=>b-a);
  for(const b of ks){h+=`<h2>${batches[b]}</h2>`;const inB=shown.filter(i=>i.batch===b);for(const g of new Set(inB.map(i=>i.group))){h+=`<h3>${esc(g)}</h3><div class="grid">`+inB.filter(i=>i.group===g).map(card).join('')+'</div>'}}
  }
  document.getElementById('out').innerHTML=h||'<p class="mu" style="margin-top:32px">这里还没有东西。在任意一张图的右上角点 ♡，它就会出现在“我喜欢的”。</p>';
  document.getElementById('sub').textContent=`一共 ${items.length} 张，现在显示 ${shown.length} 张。全部是草图，应用里什么都没换。点图放大，点 ♡ 标记喜欢。`;
  const p=document.getElementById('picked');if(p)p.innerHTML=likes.size?`已选 ${likes.size} 个 <button class="btn" id="copy">复制名单</button> <span id="copied"></span>`:'';
}
const dlg=document.getElementById('dlg');
function open_(id){
  const i=items.find(x=>x.id===id);if(!i)return;
  const off=i.off||i.on;const bars=i.on?`<div class="bigbars"><div class="b light"><span>平时</span>${i.on}</div><div class="b dark"><span>平时</span>${i.on}</div><div class="b light"><span>3 个要处理</span><span style="display:flex;gap:2px;align-items:center">${i.need}3</span></div><div class="b dark"><span>3 个要处理</span><span style="display:flex;gap:2px;align-items:center">${i.need}3</span></div><div class="b light"><span>连不上后台</span>${off}</div><div class="b dark"><span>连不上后台</span>${off}</div></div>`:'<p class="mu">这张没有托盘图。</p>';
  dlg.innerHTML=`<div class="dlg"><div class="${i.anim?'pulse':''}"><img class="big" src="${i.img}" alt="${esc(i.name)}"></div><div><h2>${esc(i.name)}</h2><p class="mu">${batches[i.batch]}${i.by==='Codex'?' · 点子来自 Codex':''}</p><p>${esc(i.idea)}</p>${i.risk?`<p class="mu"><b>风险：</b>${esc(i.risk)}</p>`:''}<div class="sizes">${[64,32,16].map(n=>`<img src="${i.img}" width="${n}" height="${n}" alt="">`).join('')}</div>${bars}<div class="navs"><button class="btn" data-l="${i.id}">${likes.has(i.id)?'♥ 已喜欢':'♡ 喜欢'}</button><button class="btn" data-n="-1">上一张</button><button class="btn" data-n="1">下一张</button><button class="btn" data-x="1">关闭</button></div></div></div>`;
  dlg.dataset.id=id;if(!dlg.open)dlg.showModal();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t){if(e.target===dlg)dlg.close();return}
  if(t.dataset.v){view=t.dataset.v;chips();render()}
  else if(t.dataset.b){batch=t.dataset.b;chips();render()}
  else if(t.dataset.o)open_(t.dataset.o);
  else if(t.dataset.l){const id=t.dataset.l;likes.has(id)?likes.delete(id):likes.add(id);save();render();if(dlg.open)open_(id)}
  else if(t.dataset.n){const k=shown.findIndex(i=>i.id===dlg.dataset.id);const n=shown[(k+ +t.dataset.n+shown.length)%shown.length];if(n)open_(n.id)}
  else if(t.dataset.x)dlg.close();
  else if(t.id==='copy'){const txt=items.filter(i=>likes.has(i.id)).map(i=>`${batches[i.batch]} / ${i.name}`).join('\n');const done=m=>{const c=document.getElementById('copied');if(c)c.textContent=m};(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>done('已复制，贴给 Claude 就行'),()=>{window.prompt('复制这份名单：',txt)})}
});
document.addEventListener('keydown',e=>{if(!dlg.open)return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const k=shown.findIndex(i=>i.id===dlg.dataset.id);const n=shown[(k+(e.key==='ArrowRight'?1:-1)+shown.length)%shown.length];if(n)open_(n.id)}});
chips();render();
if(location.hash==='#ring'){view='ring';chips();render()}
const m=location.hash.match(/^#open=(.+)/);if(m)open_(m[1]);
</script></body></html>
