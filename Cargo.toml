[workspace]
resolver = "2"
members = ["crates/mooring-platform", "crates/mooring-core", "crates/mooring-host", "crates/mooring-remote", "crates/mooring-relay", "crates/mooring-app", "crates/mooring-plugin-host"]
default-members = ["crates/mooring-platform", "crates/mooring-core", "crates/mooring-host", "crates/mooring-remote", "crates/mooring-relay"]
exclude = [".deps/zed", ".deps/libghostty-rs", "plugins"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
libghostty-vt = { path = ".deps/libghostty-rs/crates/libghostty-vt" }

[profile.dev]
debug = 0
