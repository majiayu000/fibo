[workspace]
resolver = "2"
members = ["crates/fibo-platform", "crates/fibo-core", "crates/fibo-host", "crates/fibo-remote", "crates/fibo-relay", "crates/fibo-app", "crates/fibo-plugin-host"]
default-members = ["crates/fibo-platform", "crates/fibo-core", "crates/fibo-host", "crates/fibo-remote", "crates/fibo-relay"]
exclude = [".deps/zed", ".deps/libghostty-rs", "plugins"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
libghostty-vt = { path = ".deps/libghostty-rs/crates/libghostty-vt" }

[profile.dev]
debug = 0
