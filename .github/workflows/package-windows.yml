name: Windows installer

# Builds the release window and host with MSVC (the runner's Windows SDK has fxc.exe for the
# shaders), lays them out with packaging/windows/stage.py and wraps them with Inno Setup.
# The installer is an artifact of the run only: publishing a release is a separate decision.
# Unsigned, so Windows SmartScreen warns about an unknown publisher on first run.
on:
  pull_request:
    branches:
      - main
    paths:
      - crates/**
      - plugins/**
      - Cargo.lock
      - rust-toolchain.toml
      - bootstrap.sh
      - patches/**
      - packaging/windows/**
      - .github/workflows/package-windows.yml
  # Nightly on main as well (#507): pull requests start this only when their paths match,
  # so main's own state on this platform was otherwise never checked.
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

concurrency:
  group: package-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Windows installer
    # Not windows-latest or windows-2025: both are the VS 2026 image, whose MSVC 14.52 (from
    # 20261116) has an STL that refuses anything older than Clang 22, and Zig 0.16 compiles
    # Ghostty's C++ with an older clang. windows-2022 has VS 2022.
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Prepare pinned native dependencies
        shell: bash
        run: sh bootstrap.sh

      - name: Release build
        env:
          LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast
        run: cargo build --release -p fibo-app -p fibo-host

      # Bundled files are trusted with the app; official remote signing stays in sign-catalog.
      # Keep this index on the disposable runner, never commit it over the signed catalog.
      - name: Index the plugins bundled with this build
        run: .\target\release\fibo.exe plugins index plugins

      - name: Stage
        run: python packaging/windows/stage.py --output target/windows-stage

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = (Select-String -Path crates/fibo-app/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & $iscc "/DStage=$PWD\target\windows-stage" "/DVersion=$version" "/O$PWD\target\installer" packaging\windows\fibo.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem target\installer | ForEach-Object { "$($_.Name) $([int]($_.Length/1MB)) MB" }

      # What every 0.1.3 user does by hand: run the new Setup while the old host is serving.
      # The host has no window, so only the installer's own stop lets fibo.exe be replaced.
      - name: Upgrade over a running released host
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $install = "$env:RUNNER_TEMP\fibo-upgraded"
          $old = "$env:RUNNER_TEMP\fibo-old"
          gh release download v0.1.3 --repo $env:GITHUB_REPOSITORY --pattern 'Fibo-Setup-*.exe' --dir $old
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the released installer' }
          $quiet = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$install`"")
          $p = Start-Process -FilePath (Get-ChildItem "$old\*.exe")[0].FullName -ArgumentList $quiet -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Old installer exited $($p.ExitCode)" }
          $rt = "$env:RUNNER_TEMP\fibo-upgrade-rt"
          $env:MOORING_RUNTIME = $rt
          $oldHost = Start-Process -FilePath "$install\bin\fibo.exe" -ArgumentList @('serve','--runtime',$rt) -PassThru -WindowStyle Hidden
          Start-Sleep 3
          & "$install\bin\fibo.exe" list --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Old host did not answer' }
          $setup = (Get-ChildItem target\installer\*.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $setup -ArgumentList ($quiet + "/LOG=`"$PWD\target\installer\upgrade.log`"") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Upgrade exited $($p.ExitCode) (log: upgrade.log in the artifact)" }
          if (-not $oldHost.HasExited) { throw 'The old host is still running' }
          Get-ChildItem target\windows-stage\bin -File -Recurse | ForEach-Object {
            $rel = $_.FullName.Substring((Resolve-Path target\windows-stage\bin).Path.Length)
            if ((Get-FileHash $_.FullName).Hash -ne (Get-FileHash "$install\bin$rel").Hash) { throw "bin$rel is not the new build's" }
          }
          # What the window does when it opens: start this build's host on the runtime the
          # stopped one left behind (its lock and socket file are still there).
          $newHost = Start-Process -FilePath "$install\bin\fibo.exe" -ArgumentList @('serve','--runtime',$rt) -PassThru -WindowStyle Hidden
          try {
            Start-Sleep 3
            & "$install\bin\fibo.exe" list --json | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'The new host did not start on the old runtime' }
          } finally {
            Stop-Process -Id $newHost.Id -Force -ErrorAction SilentlyContinue
          }
          $p = Start-Process -FilePath "$install\unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Uninstall exited $($p.ExitCode)" }

      # Exercise the installer itself, in a directory owned only by this job.
      - name: Install, run the installed host, and uninstall
        shell: pwsh
        run: |
          $install = "$env:RUNNER_TEMP\fibo-installed"
          $setup = (Get-ChildItem target\installer\*.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$install`"") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer exited $($p.ExitCode)" }
          if (-not (Test-Path "$install\Resources\plugins\index.json")) { throw 'Installed catalog missing' }
          $rt = "$env:RUNNER_TEMP\fibo-rt"
          $host_ = Start-Process -FilePath "$install\bin\fibo.exe" -ArgumentList @('serve','--runtime',$rt) -PassThru -WindowStyle Hidden
          try {
            Start-Sleep 3
            $env:MOORING_RUNTIME = $rt
            & "$install\bin\fibo.exe" list --json | Tee-Object target\installer\installed-host.json
            if ($LASTEXITCODE -ne 0) { throw 'Installed host did not answer' }
            & "$install\bin\mooring.exe" --version
            if ($LASTEXITCODE -ne 0) { throw 'Old CLI name did not start' }
          } finally {
            Stop-Process -Id $host_.Id -Force -ErrorAction SilentlyContinue
          }
          $p = Start-Process -FilePath "$install\unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($p.ExitCode -ne 0 -or (Test-Path "$install\bin\fibo.exe")) { throw 'Uninstall did not remove the installed executable' }
          $manifest = @{ source = (git rev-parse HEAD); installer = (Split-Path $setup -Leaf); sha256 = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower(); signed = ((Get-AuthenticodeSignature $setup).Status -eq 'Valid'); published = $false }
          $manifest | ConvertTo-Json | Set-Content target\installer\manifest.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Fibo-Setup-windows-x64
          path: target/installer/
          retention-days: 14
