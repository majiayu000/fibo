name: Windows installer

# Builds the release window and host with MSVC (the runner's Windows SDK has fxc.exe for the
# shaders), lays them out with packaging/windows/stage.py and wraps them with Inno Setup.
# The installer is an artifact of the run only: publishing a release is a separate decision.
# Unsigned, so Windows SmartScreen warns about an unknown publisher on first run.
on:
  pull_request:
    branches:
      - main
    paths:
      - packaging/windows/**
      - .github/workflows/package-windows.yml
  workflow_dispatch:

concurrency:
  group: package-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Prepare pinned native dependencies
        shell: bash
        run: sh bootstrap.sh

      - name: Release build
        env:
          LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast
        run: cargo build --release -p fibo-app -p fibo-host

      - name: Stage
        run: python packaging/windows/stage.py --output target/windows-stage

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = (Select-String -Path crates/fibo-app/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & $iscc "/DStage=$PWD\target\windows-stage" "/DVersion=$version" "/O$PWD\target\installer" packaging\windows\fibo.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem target\installer | ForEach-Object { "$($_.Name) $([int]($_.Length/1MB)) MB" }

      # The installed layout must start: the host serves and answers from an isolated runtime.
      - name: Smoke test the staged host
        shell: pwsh
        run: |
          $rt = "$env:RUNNER_TEMP\fibo-rt"
          $host_ = Start-Process -FilePath target\windows-stage\bin\fibo.exe -ArgumentList @('serve','--runtime',$rt) -PassThru -WindowStyle Hidden
          Start-Sleep 3
          $env:MOORING_RUNTIME = $rt
          & target\windows-stage\bin\fibo.exe list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Stop-Process -Id $host_.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Fibo-Setup-windows-x64
          path: target/installer/*.exe
          retention-days: 14
