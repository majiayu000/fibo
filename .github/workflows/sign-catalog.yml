name: Sign plugin catalog

# After a push that changes the plugins or the index format, regenerates plugins/index.json,
# signs it and sends both to main in a pull request that merges itself once CI passes: main
# takes no direct push, not even from here (docs/decisions/2026-11-06-main-requires-ci.md).
# That merge starts no further run, because what GITHUB_TOKEN does starts no workflows.
on:
  push:
    branches:
      - main
    paths:
      - plugins/**
      - crates/fibo-core/src/market*.rs
      - crates/fibo-host/src/plugins_cmd.rs
      - scripts/publish-catalog.sh
      - .github/workflows/sign-catalog.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: sign-catalog
  cancel-in-progress: false

jobs:
  # Compiling runs third-party build scripts, so this job holds no secret and cannot push.
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Installs what rust-toolchain.toml pins: the version, rustfmt, clippy, the wasm target.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Prepare pinned native dependencies
        run: sh bootstrap.sh

      - name: Build
        run: cargo build --locked -p fibo-host --bin fibo

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fibo
          path: target/debug/fibo
          retention-days: 1

  # Holds the key and can push, and compiles nothing.
  sign:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fibo
          path: ${{ runner.temp }}/bin

      - name: Sign and push to the catalog branch
        id: sign
        env:
          # To retire this key, change the name to MOORING_PUBLISHER_KEY_SPARE, then build the
          # next pair into OFFICIAL_KEYS and ship an app that has it.
          PUBLISHER_KEY: ${{ secrets.MOORING_PUBLISHER_KEY }}
          BIN: ${{ runner.temp }}/bin/fibo
          KEY_FILE: ${{ runner.temp }}/publisher.key
        run: |
          chmod +x "$BIN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          trap 'rm -f "$KEY_FILE"' EXIT
          (umask 077 && printf '%s' "$PUBLISHER_KEY" > "$KEY_FILE")
          sh scripts/publish-catalog.sh "$BIN" "$KEY_FILE"

      # A step of its own: this token can open and merge pull requests, and neither the key
      # nor the compiled binary is around when it is used.
      - name: Open the pull request and start its CI
        if: steps.sign.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head catalog-signed \
            --title "chore(plugins): CI 重新生成目录并签名" \
            --body "sign-catalog 自动生成，CI 通过后自动合入。" || true
          gh pr merge catalog-signed --auto --merge
          gh workflow run ci.yml --ref catalog-signed
