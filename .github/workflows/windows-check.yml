name: Windows check

# Whether mooring-core still builds for Windows, without a macOS runner. Not a required check
# (docs/decisions/2026-11-06-main-requires-ci.md), so red here shows and blocks nothing. A file
# of its own: ci.yml is part of the macOS cache key, and changing it costs every job a rebuild.
on:
  pull_request:
    branches:
      - main
    paths:
      - crates/mooring-core/**
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/windows-check.yml
  # By hand, the tests on real Windows: the only place core's Windows code runs so far.
  workflow_dispatch:

concurrency:
  group: windows-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-check:
    name: mooring-core for Windows (cross check)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain and the Windows std
        run: |
          rustup toolchain install --no-self-update
          rustup component add clippy
          rustup target add x86_64-pc-windows-gnu

      # Builds libghostty-vt for the target; no mingw is needed for a check of this crate.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Prepare pinned native dependencies
        run: sh bootstrap.sh

      - name: Clippy for Windows
        run: cargo clippy -p mooring-core --all-targets --target x86_64-pc-windows-gnu -- -D warnings

  tests-on-windows:
    name: mooring-core tests on Windows
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Prepare pinned native dependencies
        shell: bash
        run: sh bootstrap.sh

      - name: Cargo test
        run: cargo test -p mooring-core
