name: Linux check

# The crates that already run on Linux, on Linux: what they and mooring-platform promise
# (docs/platform/index.html). Not a required check yet (docs/decisions/2026-11-06-main-requires-ci.md),
# so red here shows and blocks nothing. Another platform's implementation files do not start
# it: they are not compiled here. A file of its own: ci.yml is part of the macOS cache key, and
# changing it costs every job a rebuild.
on:
  pull_request:
    branches:
      - main
    paths:
      - crates/mooring-platform/**
      - crates/mooring-core/**
      - crates/mooring-host/**
      - crates/mooring-remote/**
      - crates/mooring-relay/**
      - crates/mooring-plugin-host/**
      - Cargo.lock
      - rust-toolchain.toml
      - bootstrap.sh
      - .github/workflows/platform-linux.yml
      - '!crates/mooring-platform/src/**/windows.rs'
      - '!crates/mooring-platform/src/**/macos.rs'
  workflow_dispatch:

concurrency:
  group: platform-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Shared crates on Linux
    runs-on: ubuntu-latest
    # Normally well under this. A test that hangs should fail, not hold a runner for six hours.
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup component add clippy

      # Builds libghostty-vt for the target.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Prepare pinned native dependencies
        shell: bash
        run: sh bootstrap.sh

      # The tests that drive real shells start zsh too, which Agents' shells mostly are.
      # A runner's shared zsh folders are writable by a group, and zsh then stops to ask.
      - name: Install zsh
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          sudo chmod -R go-w /usr/local/share/zsh /usr/share/zsh

      - name: Clippy
        run: |
          cargo clippy -p mooring-platform -p mooring-core -p mooring-remote -p mooring-relay -p mooring-plugin-host --all-targets -- -D warnings
          cargo clippy -p mooring-host --all-targets -- -D warnings

      - name: Cargo test
        run: |
          cargo test -p mooring-platform -p mooring-core -p mooring-remote -p mooring-relay -p mooring-plugin-host --no-fail-fast
          cargo test -p mooring-host --tests --no-fail-fast
