name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Each push to main runs everything on scarce macOS runners, and many sessions push: 14 runs
# queued in one night and none finished. At most one runs and one waits; a newer push replaces
# the waiting one. A running one is left to finish, or frequent pushes would never get a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mooring:
    name: Workbench Rust checks
    runs-on: macos-latest
    env:
      LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      # Local rust-toolchain.toml pins the same rustfmt/clippy version.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Prepare pinned native dependencies
        run: sh bootstrap.sh

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Neither clippy nor the tests turn on visual-test or build examples/, so that code broke
      # unnoticed (docs/file-split/README.md, 陷阱 4、5). check, not clippy: clippy with the
      # feature has known errors on the baseline.
      - name: Cargo check app with visual-test (incl. examples)
        run: cargo check -p mooring-app --all-targets --features visual-test

      # managed_session runs real terminals against wall-clock limits; its failed cases get
      # one retry each, every other failure fails the step (see ci-test.sh).
      - name: Cargo test
        run: sh ci-test.sh

      - name: Upload managed_session retries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-retries
          path: target/ci-test-retries.txt
          if-no-files-found: ignore

  window-perf:
    name: Window performance gate
    runs-on: macos-latest
    env:
      LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Prepare pinned native dependencies
        run: sh bootstrap.sh

      - name: Build the probe
        run: cargo build --release -p mooring-host -p mooring-app --features mooring-app/visual-test

      # Instructions per frame against crates/mooring-app/perf-baseline.txt, pixel checks
      # of each redraw, and no catch-up loop (see the script's header).
      - name: Window performance gate
        run: python3 scripts/perf-gate.py target/release target/perf-gate

      # Each theme scene in a real window: clicks, saved files, pixels it asserts on.
      - name: Theme scenes
        run: python3 scripts/theme-scenes.py target/release target/theme-scenes

      - name: Keep the gate's pictures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate
          path: |
            target/perf-gate
            target/theme-scenes

  mobile:
    name: Phone app tests and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # Also checks the app against crates/mooring-remote/vectors/v1.json.
      - name: Bun test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

  relay-image:
    name: Relay image for self-hosting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image docs/relay/self-host.md tells people to build; built here, not pushed.
      - name: Build the relay image
        run: docker build -f crates/mooring-relay/Dockerfile -t mooring-relay:ci .

      - name: The image starts and passes its own health check
        run: |
          docker run --rm mooring-relay:ci --version
          docker run -d --name relay -p 127.0.0.1:8787:8787 mooring-relay:ci
          for i in $(seq 20); do curl -fs 127.0.0.1:8787/healthz && break; sleep 1; done
          curl -fs 127.0.0.1:8787/healthz | grep -q '"ok":true'
          docker exec relay mooring-relay --check

      - name: Take the binary out of the image
        run: |
          docker create --name out mooring-relay:ci
          docker cp out:/usr/local/bin/mooring-relay mooring-relay-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: mooring-relay-linux-x86_64
          path: mooring-relay-linux-x86_64
