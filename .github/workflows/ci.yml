name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Pull requests a workflow opens start no run of their own: sign-catalog asks for this one.
  workflow_dispatch:

# Each push to main runs everything on scarce macOS runners, and many sessions push: 14 runs
# queued in one night and none finished. At most one runs and one waits; a newer push replaces
# the waiting one. A running one is left to finish, or frequent pushes would never get a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mooring:
    name: Workbench Rust checks
    runs-on: macos-latest
    permissions:
      contents: read
      statuses: write
    env:
      LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast
      # Incremental state is not worth its size in the target/ cache.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      # 2026-11-08 history was rewritten from d32157e on (docs/decisions/2026-11-08-scrub-relay-address.md).
      # A branch still built on the old history would bring the old commits back. The compare API
      # says "ahead"/"identical" when d32157e is an ancestor; once GitHub purges it, a 404 passes.
      - name: Old history before the 2026-11-08 rewrite stays out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/${{ github.repository }}/compare/d32157efe3f5acda9f5ede4b3a6c8b0df1753201...${{ github.sha }}" --jq .status 2>/dev/null || echo gone)
          echo "d32157e vs ${{ github.sha }}: $status"
          case "$status" in
            ahead|identical)
              echo "::error::This branch is built on the history from before 2026-11-08. Rebase it: git rebase --onto origin/main <old base> (see docs/decisions/2026-11-08-scrub-relay-address.md)."
              exit 1 ;;
          esac

      - name: Protocol probe disconnect regression
        run: python3 -I eval/protocol-contract/test_check.py

      # Installs what rust-toolchain.toml pins: the version, rustfmt, clippy, the wasm target.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      # Its own cache saves a new 25MB entry per run, which filled the quota; .zig-cache (its
      # ZIG_GLOBAL_CACHE_DIR, where Ghostty's Zig packages and build runner go) is in the cache below.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      # Cargo rebuilds path dependencies whose sources are newer than their outputs, so a fresh
      # clone of .deps (GPUI, libghostty-rs) would rebuild them even with target/ restored.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('bootstrap.sh', 'patches/**') }}

      # The Ghostty checkout and its local Zig cache sit under libghostty-vt-sys's OUT_DIR in target/.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .zig-cache
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'bootstrap.sh', 'patches/**', '.github/workflows/ci.yml') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-

      - name: Prepare pinned native dependencies
        run: sh bootstrap.sh

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.0

      # Security advisories only (see deny.toml); needs .deps for the dependency graph.
      - name: Cargo deny advisories
        run: cargo deny check advisories

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Neither clippy nor the tests turn on visual-test or build examples/, so that code broke
      # unnoticed (docs/file-split/README.md, 陷阱 4、5).
      - name: Clippy app with visual-test (incl. examples)
        run: cargo clippy -p mooring-app --all-targets --features visual-test -- -D warnings

      # managed_session runs real terminals against wall-clock limits; its failed cases get
      # one retry each, every other failure fails the step (see ci-test.sh).
      - name: Cargo test
        run: sh ci-test.sh

      - name: Upload managed_session retries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-retries
          path: target/ci-test-retries.txt
          if-no-files-found: ignore
      # GitHub does not count a dispatched run's checks for a pull request, so its result is
      # written on the commit under the same name. Only a run that got this far passed.
      - name: Report the result to the pull request
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }}
          -f state=success -f context="Workbench Rust checks"

  window-perf:
    name: Window performance gate
    runs-on: macos-latest
    env:
      LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast
    steps:
      - uses: actions/checkout@v4

      # Installs what rust-toolchain.toml pins: the version, rustfmt, clippy, the wasm target.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      # Its own cache saves a new 25MB entry per run, which filled the quota; .zig-cache (its
      # ZIG_GLOBAL_CACHE_DIR, where Ghostty's Zig packages and build runner go) is in the cache below.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      # Cargo rebuilds path dependencies whose sources are newer than their outputs, so a fresh
      # clone of .deps (GPUI, libghostty-rs) would rebuild them even with target/ restored.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('bootstrap.sh', 'patches/**') }}

      # The Ghostty checkout and its local Zig cache sit under libghostty-vt-sys's OUT_DIR in target/.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .zig-cache
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'bootstrap.sh', 'patches/**', '.github/workflows/ci.yml') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-

      - name: Prepare pinned native dependencies
        run: sh bootstrap.sh

      - name: Build the probe
        run: cargo build --release -p mooring-host -p mooring-app --features mooring-app/visual-test

      - name: Performance fixture cleanup regression
        run: python3 -I scripts/test_perf_fixture.py target/release

      # Instructions per frame against crates/mooring-app/perf-baseline.txt, pixel checks
      # of each redraw, and no catch-up loop (see the script's header).
      - name: Window performance gate
        run: python3 scripts/perf-gate.py target/release target/perf-gate

      # Each theme scene in a real window: clicks, saved files, pixels it asserts on.
      - name: Theme scenes
        run: python3 scripts/theme-scenes.py target/release target/theme-scenes

      - name: Keep the gate's pictures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate
          path: |
            target/perf-gate
            target/theme-scenes

  mobile:
    name: Phone app tests and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # Also checks the app against crates/mooring-remote/vectors/v1.json.
      - name: Bun test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

  relay-image:
    name: Relay image for self-hosting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image docs/relay/self-host.md tells people to build; built here, not pushed.
      - name: Build the relay image
        run: docker build -f crates/mooring-relay/Dockerfile -t mooring-relay:ci .

      - name: The image starts and passes its own health check
        run: |
          docker run --rm mooring-relay:ci --version
          docker run -d --name relay -p 127.0.0.1:8787:8787 mooring-relay:ci
          for i in $(seq 20); do curl -fs 127.0.0.1:8787/healthz && break; sleep 1; done
          curl -fs 127.0.0.1:8787/healthz | grep -q '"ok":true'
          docker exec relay mooring-relay --check

      - name: Take the binary out of the image
        run: |
          docker create --name out mooring-relay:ci
          docker cp out:/usr/local/bin/mooring-relay mooring-relay-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: mooring-relay-linux-x86_64
          path: mooring-relay-linux-x86_64
