name: iOS native build

on:
  pull_request:
    paths: ['mobile/**', 'crates/fibo-remote/vectors/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['mobile/**', 'crates/fibo-remote/vectors/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Build the standalone Release app
        run: bash mobile/tools/build-ios-simulator.sh
      - name: Install and cold-start twice
        run: python3 mobile/tools/smoke-ios-simulator.py
      - name: Compile for physical iPhones
        if: ${{ !cancelled() }}
        run: bash mobile/tools/build-ios-device.sh
      - name: Keep native evidence and the simulator package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-simulator
          path: |
            target/ios-evidence/build-manifest.txt
            target/ios-evidence/simulator-build.log
            target/ios-evidence/Fibo-ios-simulator.zip
            target/ios-evidence/native-smoke
      - name: Keep the unsigned iPhone archive and its evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-device-unsigned
          path: |
            target/ios-device-evidence/Fibo-ios-device-unsigned.zip
            target/ios-device-evidence/build-manifest.txt
            target/ios-device-evidence/device-build.log
