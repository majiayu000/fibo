name: Publish Fibo website
on:
  push:
    branches: [main]
    paths: ['docs/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mooring-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage only public website files
        run: |
          mkdir -p _site
          cp docs/site/index.html docs/site/sitemap.xml docs/site/CNAME _site/
          cp docs/site/polish.css docs/site/extra.css docs/site/extra.js docs/site/i18n.js _site/
          cp -R docs/site/assets docs/site/agents docs/site/art-b docs/site/brand docs/site/fonts docs/site/media docs/site/shots _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
