name: Windows check

# The crates that already run on Windows, on Windows: what they and fibo-platform promise
# (docs/platform/index.html). Not a required check yet (docs/decisions/2026-11-06-main-requires-ci.md),
# so red here shows and blocks nothing. Another platform's implementation files do not start
# it: they are not compiled here. A file of its own: ci.yml is part of the macOS cache key, and
# changing it costs every job a rebuild.
on:
  pull_request:
    branches:
      - main
    paths:
      - crates/fibo-platform/**
      - crates/fibo-core/**
      - crates/fibo-remote/**
      - crates/fibo-relay/**
      - crates/fibo-plugin-host/**
      - crates/fibo-host/**
      - crates/fibo-app/**
      - Cargo.lock
      - rust-toolchain.toml
      - bootstrap.sh
      - .github/workflows/platform-windows.yml
      - '!crates/fibo-platform/src/**/unix.rs'
      - '!crates/fibo-platform/src/**/macos.rs'
      - '!crates/fibo-platform/src/**/linux.rs'
  # Nightly on main as well (#507): pull requests start this only when their paths match,
  # so main's own state on this platform was otherwise never checked.
  schedule:
    - cron: '27 3 * * *'
  workflow_dispatch:

concurrency:
  group: platform-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Shared crates on Windows
    # Not windows-latest or windows-2025: see package-windows.yml (MSVC 14.52's STL needs Clang 22, Zig 0.16 has older).
    runs-on: windows-2022
    # Normally well under this. A test that hangs should fail, not hold a runner for six hours.
    timeout-minutes: 45
    env:
      # Error-message fixtures are Chinese; production follows the system language.
      MOORING_LANG: zh
      CARGO_INCREMENTAL: 0
    steps:
      # Tests compare files byte for byte; a checkout must not rewrite line endings.
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup component add clippy

      # Builds libghostty-vt for the target.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Prepare pinned native dependencies
        shell: bash
        run: sh bootstrap.sh

      - name: Clippy
        run: cargo clippy -p fibo-platform -p fibo-core -p fibo-remote -p fibo-relay -p fibo-plugin-host --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test -p fibo-platform -p fibo-core -p fibo-remote -p fibo-relay -p fibo-plugin-host --no-fail-fast

      # Lib and bins only; the host's unit tests run below.
      - name: Clippy on the host
        run: cargo clippy -p fibo-host --lib --bins -- -D warnings

      # The window compiles here; nobody has looked at it on a screen in CI.
      - name: Clippy on the window app
        run: cargo clippy -p fibo-app --bins -- -D warnings

      - name: A real terminal through the host
        run: cargo test -p fibo-host --test terminal_chain

      # The host's unit tests (#506): only terminal_chain ran here, and a Unix-only assumption
      # in replace_file hid for two weeks. Tests that cannot hold on Windows are ignored there
      # by name, with the reason, so the list only shrinks.
      - name: The host's unit tests
        run: cargo test -p fibo-host --lib --no-fail-fast

      # The tests above that do not run here, by count, in crates/fibo-host/src: ignored by
      # `cfg_attr(windows, ignore = "...")` (or `target_os = "windows"`), and #[test]s compiled
      # out by `cfg(unix)` / `cfg(not(windows))` on the function. Prefer the ignore: it keeps
      # the test compiling here. A test fixed lowers its baseline; a new one has to say in its
      # change why it raises it. Not counted: a whole module behind `cfg(unix)`.
      - name: Host tests skipped on Windows stay counted
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          ignored_baseline=23
          unix_only_baseline=8
          read -r ignored unix_only < <(find crates/fibo-host/src -name '*.rs' -print0 | xargs -0 perl -0777 -ne '
            $win = qr/(?:windows|target_os\s*=\s*"windows")/;
            $off = qr/cfg\(\s*(?:unix|not\(\s*$win\s*\))\s*\)/;
            $at = qr/#\[[^\]]*\]\s*/;
            $i += () = /cfg_attr\(\s*$win\s*,\s*ignore/g;
            $u += () = /#\[$off\]\s*(?:$at)*#\[test\]|#\[test\]\s*(?:$at)*#\[$off\]/g;
            END { print $i + 0, " ", $u + 0, "\n" }' | awk '{ i += $1; u += $2 } END { print i + 0, u + 0 }')
          echo "fibo-host tests ignored on Windows: $ignored (baseline $ignored_baseline)"
          echo "fibo-host tests compiled out on Windows: $unix_only (baseline $unix_only_baseline)"
          if [ "$ignored" -ne "$ignored_baseline" ] || [ "$unix_only" -ne "$unix_only_baseline" ]; then
            echo "::error::fibo-host skips $ignored + $unix_only tests on Windows, the baselines are $ignored_baseline + $unix_only_baseline; change them in platform-windows.yml along with the tests"
            exit 1
          fi
