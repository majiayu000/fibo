name: Windows check

# The crates that already run on Windows, on Windows: what they and fibo-platform promise
# (docs/platform/index.html). Not a required check yet (docs/decisions/2026-11-06-main-requires-ci.md),
# so red here shows and blocks nothing. Another platform's implementation files do not start
# it: they are not compiled here. A file of its own: ci.yml is part of the macOS cache key, and
# changing it costs every job a rebuild.
on:
  pull_request:
    branches:
      - main
    paths:
      - crates/fibo-platform/**
      - crates/fibo-core/**
      - crates/fibo-remote/**
      - crates/fibo-relay/**
      - crates/fibo-plugin-host/**
      - crates/fibo-host/**
      - crates/fibo-app/**
      - Cargo.lock
      - rust-toolchain.toml
      - bootstrap.sh
      - .github/workflows/platform-windows.yml
      - '!crates/fibo-platform/src/**/unix.rs'
      - '!crates/fibo-platform/src/**/macos.rs'
      - '!crates/fibo-platform/src/**/linux.rs'
  workflow_dispatch:

concurrency:
  group: platform-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Shared crates on Windows
    runs-on: windows-latest
    # Normally well under this. A test that hangs should fail, not hold a runner for six hours.
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
    steps:
      # Tests compare files byte for byte; a checkout must not rewrite line endings.
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup component add clippy

      # Builds libghostty-vt for the target.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Prepare pinned native dependencies
        shell: bash
        run: sh bootstrap.sh

      - name: Clippy
        run: cargo clippy -p fibo-platform -p fibo-core -p fibo-remote -p fibo-relay -p fibo-plugin-host --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test -p fibo-platform -p fibo-core -p fibo-remote -p fibo-relay -p fibo-plugin-host --no-fail-fast

      # The host's own tests still assume Unix; this much says it builds and works here.
      - name: Clippy on the host
        run: cargo clippy -p fibo-host --lib --bins -- -D warnings

      # The window compiles here; nobody has looked at it on a screen in CI.
      - name: Clippy on the window app
        run: cargo clippy -p fibo-app --bins -- -D warnings

      - name: A real terminal through the host
        run: cargo test -p fibo-host --test terminal_chain
